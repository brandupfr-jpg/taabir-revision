<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التعبير - الدرس الأول</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#1f2a24;--muted:#6f7a73;--accent:#2f6b4f;--accent2:#e6efe9;--good:#1f7a4d;--bad:#a33a3a;--line:#dfe6e1}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#234c39,#3c7659);color:#fff;padding:24px 20px;border-radius:24px;box-shadow:0 10px 30px rgba(31,42,36,.12)}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.9}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(31,42,36,.06)}
.menu{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%}.btn.secondary{background:var(--accent2);color:var(--accent)}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);padding:14px;border-radius:14px;margin:10px 0;font-size:17px;cursor:pointer}.option.selected{border-color:var(--accent);background:#f0f6f2}.option.correct{border-color:var(--good);background:#eef8f2}.option.wrong{border-color:var(--bad);background:#fff0f0}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:14px;color:var(--muted)}.progress{height:9px;background:#e8ece9;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}
.q{font-size:22px;font-weight:800;margin:6px 0 12px}.feedback{padding:13px 14px;border-radius:14px;margin-top:14px;font-weight:700}.feedback.good{background:#eef8f2;color:var(--good)}.feedback.bad{background:#fff0f0;color:var(--bad)}.explain{font-weight:500;color:var(--ink);margin-top:6px}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;direction:rtl;resize:vertical}.model{background:#f2f6f3;border-right:4px solid var(--accent);padding:14px;border-radius:12px;margin-top:12px}.hidden{display:none!important}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}.score{font-size:42px;font-weight:900;color:var(--accent);text-align:center;margin:18px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>التعبير – الدرس الأول</h1>
    <p>الأقليات الإسلامية، وواجب الدول الإسلامية نحوها</p>
  </section>

  <section id="home" class="card">
    <div class="pill">تدريب للاختبار</div>
    <p><b>نصف الاختبار تقريبا اختيار من متعدد، والنصف الآخر إجابات كتابية.</b></p>
    <p class="small">في بعض الأسئلة قد تكون هناك أكثر من إجابة صحيحة.</p>
    <div class="menu">
      <button class="btn" onclick="startMCQ()">تدريب الاختيار من متعدد</button>
      <button class="btn secondary" onclick="startMulti()">تدريب الاختيار بإجابات متعددة</button>
      <button class="btn secondary" onclick="startWritten()">تدريب الإجابات الكتابية</button>
      <button class="btn ghost" onclick="startMock()">اختبار تجريبي</button>
    </div>
  </section>

  <section id="quiz" class="card hidden"></section>
  <section id="result" class="card hidden"></section>
  <div class="footer">مراجعة الدرس الأول – مستوى رابع</div>
</div>
<script>
const mcqs = [
{q:"مَنْ هُمْ الأَقَلِّيَّاتُ الْمُسْلِمَةُ؟",a:"فِئَةٌ قَلِيلَةٌ مِنَ الْمُسْلِمِينَ تَعِيشُ بَيْنَ أَغْلَبِيَّةٍ غَيْرِ مُسْلِمَةٍ.",o:["فِئَةٌ قَلِيلَةٌ مِنَ الْمُسْلِمِينَ تَعِيشُ بَيْنَ أَغْلَبِيَّةٍ غَيْرِ مُسْلِمَةٍ.","جَمَاعَةٌ كَبِيرَةٌ مِنَ الْمُسْلِمِينَ تَعِيشُ فِي دَوْلَةٍ إِسْلَامِيَّةٍ.","مُسْلِمُونَ يَعِيشُونَ فِي الْجَزِيرَةِ الْعَرَبِيَّةِ فَقَطْ.","طُلَّابٌ مُسْلِمُونَ يَدْرُسُونَ فِي الْخَارِجِ."],e:"هَذَا هُوَ التَّعْرِيفُ الْمَذْكُورُ فِي الدَّرْسِ."},
{q:"فِي أَيِّ قَارَّةٍ تَتَرَكَّزُ أَكْثَرُ الأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ؟",a:"فِي قَارَّةِ آسِيَا.",o:["فِي قَارَّةِ آسِيَا.","فِي قَارَّةِ أُورُوبَّا.","فِي قَارَّةِ أَفْرِيقِيَا.","فِي قَارَّةِ أُسْتُرَالِيَا."],e:"أَكْثَرُ الأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ تَعِيشُ فِي آسِيَا."},
{q:"أَيُّ الْبِلَادِ الآتِيَةِ ذُكِرَتْ مِثَالًا لِوُجُودِ أَقَلِّيَّاتٍ إِسْلَامِيَّةٍ؟",a:"الصِّينُ وَالْيَابَانُ وَكُورِيَا وَالْفِلِبِّينُ.",o:["الصِّينُ وَالْيَابَانُ وَكُورِيَا وَالْفِلِبِّينُ.","مِصْرُ وَالسُّعُودِيَّةُ وَالْمَغْرِبُ.","قَطَرُ وَالْكُوَيْتُ وَعُمَانُ.","الْجَزَائِرُ وَتُونُسُ وَلِيبْيَا."],e:"ذَكَرَ الدَّرْسُ عِدَّةَ بِلَادٍ فِي آسِيَا مِنْهَا هَذِهِ الْبِلَادُ."},
{q:"كَيْفَ يَعِيشُ مُعْظَمُ أَفْرَادِ الأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ؟",a:"فِي فَقْرٍ وَمَعِيشَةٍ صَعْبَةٍ.",o:["فِي فَقْرٍ وَمَعِيشَةٍ صَعْبَةٍ.","فِي غِنًى وَرَفَاهِيَةٍ دَائِمَةٍ.","فِي عُزْلَةٍ تَامَّةٍ عَنِ الْمُجْتَمَعِ.","فِي بِلَادٍ إِسْلَامِيَّةٍ فَقَطْ."],e:"يَذْكُرُ الدَّرْسُ أَنَّ مُعْظَمَهُمْ يُعَانُونَ الْفَقْرَ وَصُعُوبَةَ الْمَعِيشَةِ."},
{q:"مَا أَهَمِّيَّةُ الأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ؟",a:"تُعَدُّ اللِّسَانَ النَّاطِقَ بِالإِسْلَامِ فِي تِلْكَ الْمُجْتَمَعَاتِ.",o:["تُعَدُّ اللِّسَانَ النَّاطِقَ بِالإِسْلَامِ فِي تِلْكَ الْمُجْتَمَعَاتِ.","لَا أَهَمِّيَّةَ لَهَا فِي الْعَالَمِ الإِسْلَامِيِّ.","وَاجِبُهَا الْهِجْرَةُ فَقَطْ.","دَوْرُهَا اقْتِصَادِيٌّ فَقَطْ."],e:"وَصَفَهَا الدَّرْسُ بِأَنَّهَا اللِّسَانُ النَّاطِقُ بِاسْمِ الإِسْلَامِ."},
{q:"لِمَاذَا تُقَدِّمُ فِرَقُ التَّنْصِيرِ الْمَالَ وَالْغِذَاءَ وَالسَّكَنَ كَمَا وَرَدَ فِي الدَّرْسِ؟",a:"لِدَفْعِ بَعْضِهِمْ إِلَى تَرْكِ الإِسْلَامِ وَالدُّخُولِ فِي النَّصْرَانِيَّةِ.",o:["لِدَفْعِ بَعْضِهِمْ إِلَى تَرْكِ الإِسْلَامِ وَالدُّخُولِ فِي النَّصْرَانِيَّةِ.","لِتَعْلِيمِهِمُ اللُّغَةَ الْعَرَبِيَّةَ.","لِبِنَاءِ الْمَسَاجِدِ لَهُمْ.","لِإِرْسَالِ الْعُلَمَاءِ إِلَيْهِمْ."],e:"يَرْبِطُ الدَّرْسُ بَيْنَ هَذِهِ الْمُسَاعَدَاتِ وَمُحَاوَلَةِ إِبْعَادِهِمْ عَنِ الإِسْلَامِ."},
{q:"لِمَاذَا يَرْتَدُّ بَعْضُهُمْ كَمَا ذُكِرَ فِي الدَّرْسِ؟",a:"طَمَعًا فِي الْمَالِ.",o:["طَمَعًا فِي الْمَالِ.","لِلتَّعَلُّمِ فَقَطْ.","لِلسَّفَرِ وَالسِّيَاحَةِ.","لِتَعَلُّمِ الْعَرَبِيَّةِ."],e:"جَاءَ فِي الدَّرْسِ أَنَّ بَعْضَهُمْ يَرْتَدُّ طَمَعًا فِي الْمَالِ."},
{q:"مَا الَّذِي يُعَانِيهِ الَّذِينَ يَصْبِرُونَ عَلَى الإِسْلَامِ؟",a:"تَحَدِّيَاتٍ وَتَضْيِيقًا فِي مُمَارَسَةِ شَعَائِرِهِمْ.",o:["تَحَدِّيَاتٍ وَتَضْيِيقًا فِي مُمَارَسَةِ شَعَائِرِهِمْ.","لَا يُوَاجِهُونَ أَيَّ مُشْكِلَةٍ.","يُجْبَرُونَ عَلَى الْهِجْرَةِ دَائِمًا.","يَعِيشُونَ فِي دَوْلٍ إِسْلَامِيَّةٍ."],e:"يُشِيرُ الدَّرْسُ إِلَى صُعُوبَةِ مُمَارَسَةِ الشَّعَائِرِ بِحُرِّيَّةٍ."},
{q:"إِلَى مَاذَا يَجِبُ أَنْ تَتَنَبَّهَ الدُّوَلُ الإِسْلَامِيَّةُ؟",a:"إِلَى خَطَرِ نَشَاطِ فِرَقِ التَّنْصِيرِ وَأَسَالِيبِهَا.",o:["إِلَى خَطَرِ نَشَاطِ فِرَقِ التَّنْصِيرِ وَأَسَالِيبِهَا.","إِلَى أَسْعَارِ السَّفَرِ فَقَطْ.","إِلَى تَعَلُّمِ اللُّغَاتِ الْأَجْنَبِيَّةِ.","إِلَى تَقْلِيلِ عَدَدِ الْمَسَاجِدِ."],e:"هَذَا مِنْ أَبْرَزِ التَّنْبِيهَاتِ فِي الدَّرْسِ."},
{q:"مَا وَاجِبُ الدُّوَلِ الإِسْلَامِيَّةِ نَحْوَ إِخْوَانِهِمْ فِي الْمُجْتَمَعَاتِ غَيْرِ الْمُسْلِمَةِ؟",a:"تَقْدِيمُ الْعَوْنِ الْمَادِّيِّ وَالْمَعْنَوِيِّ.",o:["تَقْدِيمُ الْعَوْنِ الْمَادِّيِّ وَالْمَعْنَوِيِّ.","تَرْكُهُمْ يَعْتَمِدُونَ عَلَى أَنْفُسِهِمْ فَقَطْ.","إِرْسَالُ السِّيَّاحِ إِلَيْهِمْ.","مَنْعُ التَّوَاصُلِ مَعَهُمْ."],e:"الدَّرْسُ يُؤَكِّدُ عَلَى الدَّعْمِ الْمَادِّيِّ وَالْمَعْنَوِيِّ."},
{q:"أَيُّ مَا يَأْتِي مِنَ الْمُسَاعَدَاتِ الْمَادِّيَّةِ؟",a:"تَوْفِيرُ الْمَالِ لِلطَّعَامِ وَالْكِسَاءِ وَالسَّكَنِ.",o:["تَوْفِيرُ الْمَالِ لِلطَّعَامِ وَالْكِسَاءِ وَالسَّكَنِ.","إِرْسَالُ الْعُلَمَاءِ فَقَطْ.","الدُّعَاءُ فَقَطْ.","تَعَلُّمُ لُغَاتِهِمْ."],e:"تَشْمَلُ الْمُسَاعَدَةُ الْمَادِّيَّةُ تَلْبِيَةَ حَاجَاتِ الْمَعِيشَةِ."},
{q:"مَاذَا يَجِبُ أَنْ تُقَدِّمَ الدُّوَلُ لِبِنَاءِ الْمَسَاجِدِ وَالْمَدَارِسِ؟",a:"الأَمْوَالَ اللَّازِمَةَ.",o:["الأَمْوَالَ اللَّازِمَةَ.","الْحُدُودَ السِّيَاسِيَّةَ.","الْجُنُودَ فَقَطْ.","الْمَوَادَّ التِّجَارِيَّةَ فَقَطْ."],e:"مِنَ الْوَاجِبِ مَدُّهُمْ بِالأَمْوَالِ لِبِنَاءِ مَدَارِسِهِمْ وَمَسَاجِدِهِمْ."},
{q:"مَاذَا تُرْسِلُ الدُّوَلُ الإِسْلَامِيَّةُ لِتَعْرِيفِهِمْ بِدِينِهِمْ؟",a:"الْعُلَمَاءَ وَالْكُتُبَ.",o:["الْعُلَمَاءَ وَالْكُتُبَ.","الطَّعَامَ فَقَطْ.","الرِّيَاضِيِّينَ.","التُّجَّارَ فَقَطْ."],e:"ذَكَرَ التَّمْرِينُ إِرْسَالَ الْعُلَمَاءِ وَالْكُتُبِ."},
{q:"مَا مَوْقِفُ الدُّوَلِ الإِسْلَامِيَّةِ مِنْ قَضَايَا الأَقَلِّيَّاتِ وَحُقُوقِهِمْ؟",a:"تَقِفُ بِجَانِبِهِمْ وَتُدَافِعُ عَنْ قَضَايَاهُمْ وَحُقُوقِهِمُ الْمَشْرُوعَةِ.",o:["تَقِفُ بِجَانِبِهِمْ وَتُدَافِعُ عَنْ قَضَايَاهُمْ وَحُقُوقِهِمُ الْمَشْرُوعَةِ.","لَا تَتَدَخَّلُ فِي شَيْءٍ.","تَطْلُبُ مِنْهُمْ تَرْكَ بِلَادِهِمْ.","تَمْنَعُهُمْ مِنَ التَّعَلُّمِ."],e:"هَذَا مِنْ وَاجِبِ الدُّوَلِ كَمَا جَاءَ فِي تَمَارِينِ الدَّرْسِ."},
{q:"أَكْمِلْ: تُعَدُّ الأَقَلِّيَّاتُ ______ النَّاطِقَ بِاسْمِ الإِسْلَامِ.",a:"اللِّسَانَ",o:["اللِّسَانَ","الْكِتَابَ","الطَّرِيقَ","الْمَالَ"],e:"الْعِبَارَةُ فِي الدَّرْسِ: «اللِّسَانَ النَّاطِقَ بِاسْمِ الإِسْلَامِ»."},
{q:"أَكْمِلْ: تُوَاجِهُ الأَقَلِّيَّاتُ عَقَبَاتٍ فِي سَبِيلِ ______ شَعَائِرِهَا.",a:"إِقَامَةِ",o:["إِقَامَةِ","تَرْكِ","نِسْيَانِ","تَغْيِيرِ"],e:"الصَّوَابُ: فِي سَبِيلِ إِقَامَةِ شَعَائِرِهِمْ."},
{q:"لِمَاذَا تُقَدَّمُ لَهُمْ الْمُسَاعَدَةُ الْمَعْنَوِيَّةُ؟",a:"لِتَرْتَفِعَ مَعْنَوِيَّاتُهُمْ وَيَثْبُتُوا عَلَى دِينِهِمْ.",o:["لِتَرْتَفِعَ مَعْنَوِيَّاتُهُمْ وَيَثْبُتُوا عَلَى دِينِهِمْ.","لِيَتْرُكُوا دِينَهُمْ.","لِيَبْتَعِدُوا عَنِ الْمُجْتَمَعِ.","لِيَتْرُكُوا التَّعَلُّمَ."],e:"الدَّعْمُ الْمَعْنَوِيُّ يُقَوِّي ثَبَاتَهُمْ وَاعْتِزَازَهُمْ بِالإِسْلَامِ."},

{q:"اُكْتُبْ فِقْرَةً قَصِيرَةً عَنْ مَوْقِفِكَ مِنَ الْأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ.",a:"أَرَى أَنَّ مُسَاعَدَةَ الْأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ وَاجِبٌ، فَنُسَاعِدُهُمْ بِالْمَالِ وَالْعِلْمِ وَالدُّعَاءِ، وَنَقِفُ مَعَهُمْ حَتَّى يَثْبُتُوا عَلَى دِينِهِمْ."},
{q:"اُكْتُبْ مَوْضُوعًا قَصِيرًا مُتَكَامِلًا عَنِ «الْأَقَلِّيَّاتِ الْإِسْلَامِيَّةِ فِي الْعَالَمِ وَوَاجِبِ الدُّوَلِ الْإِسْلَامِيَّةِ نَحْوَهَا».",a:"الْأَقَلِّيَّاتُ الْإِسْلَامِيَّةُ فِئَاتٌ قَلِيلَةٌ مِنَ الْمُسْلِمِينَ تَعِيشُ بَيْنَ أَغْلَبِيَّاتٍ غَيْرِ مُسْلِمَةٍ، وَأَكْثَرُهَا فِي آسِيَا. يُعَانِي كَثِيرٌ مِنْهُمُ الْفَقْرَ وَالتَّضْيِيقَ فِي مُمَارَسَةِ شَعَائِرِهِمْ. وَيَجِبُ عَلَى الدُّوَلِ الْإِسْلَامِيَّةِ أَنْ تُقَدِّمَ لَهُمُ الدَّعْمَ الْمَادِّيَّ وَالْمَعْنَوِيَّ، وَأَنْ تُرْسِلَ إِلَيْهِمُ الْعُلَمَاءَ وَالْكُتُبَ، وَتُسَاعِدَهُمْ فِي بِنَاءِ الْمَسَاجِدِ وَالْمَدَارِسِ، حَتَّى يَثْبُتُوا عَلَى دِينِهِمْ وَيَعْتَزُّوا بِالإِسْلَامِ."}
];

function stripTashkil(s){return String(s).replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let state={mode:"",items:[],i:0,score:0,selected:null,selectedMany:[],checked:false,mastered:0,needs:0};
function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function startMCQ(){state={mode:"mcq",items:shuffle(mcqs),i:0,score:0,selected:null,checked:false};show("quiz");renderMCQ()}
function startMulti(){state={mode:"multi",items:shuffle(multiQs),i:0,score:0,selectedMany:[],checked:false};show("quiz");renderMulti()}
function startWritten(){state={mode:"written",items:shuffle(written),i:0,mastered:0,needs:0};show("quiz");renderWritten()}
function startMock(){const qs=shuffle(mcqs).slice(0,6).map(x=>({t:"m",...x}));const ms=shuffle(multiQs).slice(0,4).map(x=>({t:"x",...x}));const ws=shuffle(written).slice(0,10).map(x=>({t:"w",...x}));state={mode:"mock",items:[...shuffle([...qs,...ms]),...ws],i:0,score:0,selected:null,selectedMany:[],checked:false,mastered:0,needs:0};show("quiz");renderMock()}
function header(title,total){const p=Math.round((state.i/total)*100);return `<div class="toprow"><span class="pill">${title}</span><span class="small">${state.i+1} / ${total}</span></div><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}
function renderMCQ(){const x=state.items[state.i],opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختيار من متعدد",state.items.length)+`<div class="q">${stripTashkil(x.q)}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${stripTashkil(o)}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pick(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMCQ}
function pick(el,val){if(state.checked)return;state.selected=val;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("check").disabled=false}
function checkMCQ(){if(!state.selected||state.checked)return;state.checked=true;const x=state.items[state.i];const ok=state.selected===x.a;if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(v===x.a)el.classList.add("correct");else if(v===state.selected&&!ok)el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ إِجَابَةٌ صَحِيحَةٌ":"❌ إِجَابَةٌ خَاطِئَةٌ"}<div class="explain">${ok?"":("الإِجَابَةُ الصَّحِيحَةُ: "+x.a+"<br>")}${x.e}</div></div><button id="next" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("next").onclick=nextMCQ;document.getElementById("check").classList.add("hidden")}
function nextMCQ(){state.i++;state.selected=null;state.checked=false;if(state.i>=state.items.length)return finishMCQ();renderMCQ()}
function finishMCQ(){show("result");document.getElementById("result").innerHTML=`<h2>النتيجة</h2><div class="score">${state.score} / ${state.items.length}</div><button class="btn" onclick="startMCQ()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}
function renderMulti(){const x=state.items[state.i],opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختر جميع الإجابات الصحيحة",state.items.length)+`<div class="small">قد تكون هناك إجابتان صحيحتان أو أكثر.</div><div class="q">${stripTashkil(x.q)}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${stripTashkil(o)}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMany(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMulti}
function pickMany(el,val){if(state.checked)return;const i=state.selectedMany.indexOf(val);if(i>=0){state.selectedMany.splice(i,1);el.classList.remove("selected")}else{state.selectedMany.push(val);el.classList.add("selected")}document.getElementById("check").disabled=state.selectedMany.length===0}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function checkMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;const x=state.items[state.i],ok=sameSet(state.selectedMany,x.a);if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(x.a.includes(v))el.classList.add("correct");else if(state.selectedMany.includes(v))el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ جَمِيعُ اخْتِيَارَاتِكَ صَحِيحَةٌ":"❌ لَمْ تَخْتَرْ جَمِيعَ الإِجَابَاتِ الصَّحِيحَةَ"}<div class="explain">${ok?"":("الإِجَابَاتُ الصَّحِيحَةُ:<br>• "+x.a.join("<br>• ")+"<br>")}${x.e}</div></div><button id="nextMulti" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextMulti").onclick=nextMulti;document.getElementById("check").classList.add("hidden")}
function nextMulti(){state.i++;state.selectedMany=[];state.checked=false;if(state.i>=state.items.length)return finishMulti();renderMulti()}
function finishMulti(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة الاختيار بإجابات متعددة</h2><div class="score">${state.score} / ${state.items.length}</div><button class="btn" onclick="startMulti()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}
function renderWritten(){const x=state.items[state.i];document.getElementById("quiz").innerHTML=header("إجابة كتابية",state.items.length)+`<div class="q">${stripTashkil(x.q)}</div><textarea id="ans" placeholder="اكتب إجابتك هنا أولا..."></textarea><button id="reveal" class="btn" style="margin-top:12px">أظهر الإجابة النموذجية</button><div id="model"></div>`;document.getElementById("reveal").onclick=revealWritten}
function revealWritten(){const txt=document.getElementById("ans").value.trim();if(!txt){alert("اكتب إجابتك أولا.");return}const x=state.items[state.i];document.getElementById("model").innerHTML=`<div class="model"><b>الإِجَابَةُ النَّمُوذَجِيَّةُ:</b><br>${x.a}</div><div class="menu" style="margin-top:12px"><button id="good" class="btn">أجبت جيدا</button><button id="review" class="btn secondary">أحتاج إلى مراجعة</button></div>`;document.getElementById("good").onclick=()=>gradeWritten(true);document.getElementById("review").onclick=()=>gradeWritten(false)}
function gradeWritten(ok){ok?state.mastered++:state.needs++;state.i++;if(state.i>=state.items.length)return finishWritten();renderWritten()}
function finishWritten(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة التدريب الكتابي</h2><div class="score">${state.mastered} / ${state.items.length}</div><p style="text-align:center">أجبت جيدا عن <b>${state.mastered}</b>، وتحتاج إلى مراجعة <b>${state.needs}</b>.</p><button class="btn" onclick="startWritten()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}
function renderMock(){if(state.i>=state.items.length)return finishMock();const x=state.items[state.i];if(x.t==="m"){const opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">اختيار من متعدد</div><div class="q">${stripTashkil(x.q)}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${stripTashkil(o)}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMock(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMockMCQ}else if(x.t==="x"){const opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">اختر جميع الإجابات الصحيحة</div><div class="q">${stripTashkil(x.q)}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${stripTashkil(o)}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>`;state.selectedMany=[];document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMockMany(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMockMulti}else{document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">إجابة كتابية</div><div class="q">${stripTashkil(x.q)}</div><textarea id="ans" placeholder="اكتب إجابتك هنا..."></textarea><button id="revealM" class="btn" style="margin-top:12px">أظهر الإجابة النموذجية</button><div id="model"></div>`;document.getElementById("revealM").onclick=revealMockWritten}}
function pickMock(el,val){if(state.checked)return;state.selected=val;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("check").disabled=false}
function checkMockMCQ(){if(!state.selected||state.checked)return;state.checked=true;const x=state.items[state.i],ok=state.selected===x.a;if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(v===x.a)el.classList.add("correct");else if(v===state.selected&&!ok)el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ إِجَابَةٌ صَحِيحَةٌ":"❌ إِجَابَةٌ خَاطِئَةٌ"}<div class="explain">${ok?"":("الإِجَابَةُ الصَّحِيحَةُ: "+x.a+"<br>")}${x.e}</div></div><button id="nextM" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextM").onclick=nextMock;document.getElementById("check").classList.add("hidden")}
function pickMockMany(el,val){if(state.checked)return;const i=state.selectedMany.indexOf(val);if(i>=0){state.selectedMany.splice(i,1);el.classList.remove("selected")}else{state.selectedMany.push(val);el.classList.add("selected")}document.getElementById("check").disabled=state.selectedMany.length===0}
function checkMockMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;const x=state.items[state.i],ok=sameSet(state.selectedMany,x.a);if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(x.a.includes(v))el.classList.add("correct");else if(state.selectedMany.includes(v))el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ جَمِيعُ اخْتِيَارَاتِكَ صَحِيحَةٌ":"❌ لَمْ تَخْتَرْ جَمِيعَ الإِجَابَاتِ الصَّحِيحَةَ"}<div class="explain">${ok?"":("الإِجَابَاتُ الصَّحِيحَةُ:<br>• "+x.a.join("<br>• ")+"<br>")}${x.e}</div></div><button id="nextM" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextM").onclick=nextMock;document.getElementById("check").classList.add("hidden")}
function revealMockWritten(){const txt=document.getElementById("ans").value.trim();if(!txt){alert("اكتب إجابتك أولا.");return}const x=state.items[state.i];document.getElementById("model").innerHTML=`<div class="model"><b>الإِجَابَةُ النَّمُوذَجِيَّةُ:</b><br>${x.a}</div><div class="menu" style="margin-top:12px"><button id="goodM" class="btn">أجبت جيدا</button><button id="reviewM" class="btn secondary">أحتاج إلى مراجعة</button></div>`;document.getElementById("goodM").onclick=()=>gradeMockWritten(true);document.getElementById("reviewM").onclick=()=>gradeMockWritten(false)}
function gradeMockWritten(ok){ok?state.mastered++:state.needs++;nextMock()}
function nextMock(){state.i++;state.selected=null;state.selectedMany=[];state.checked=false;renderMock()}
function finishMock(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة الاختبار التجريبي</h2><p style="text-align:center"><b>أسئلة الاختيار:</b></p><div class="score">${state.score} / 10</div><p style="text-align:center"><b>الإجابات الكتابية التي أجبت عنها جيدا:</b> ${state.mastered} / 10</p><button class="btn" onclick="startMock()">أَعِدِ الِاخْتِبَارَ</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}
</script>
</body>
</html>
