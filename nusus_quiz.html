const selectedCourse=Number(new URLSearchParams(location.search).get('course'));
const isLesson=[1,2,3,4,5].includes(selectedCourse);
const lessonNames=["","الدَّرْسُ الْأَوَّلُ","الدَّرْسُ الثَّانِي","الدَّرْسُ الثَّالِثُ","الدَّرْسُ الرَّابِعُ","الدَّرْسُ الْخَامِسُ"];
function chooseQuestions(){
 if(isLesson)return bank.filter(x=>x.c===selectedCourse);
 return [1,2,3,4,5].flatMap(c=>{
  const core=bank.filter(x=>x.c===c&&x.examCore);
  const practice=shuffle(bank.filter(x=>x.c===c&&!x.examCore)).slice(0,6-core.length);
  return core.concat(practice);
 });
}
let allQuestions=chooseQuestions();
let singleQs=allQuestions.filter(x=>x.type==='single');
const multiQs=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
var state={mode:'',items:[],i:0,score:0,selected:null,selectedMany:[],checked:false};
function show(id){['home','quiz','result'].forEach(function(x){document.getElementById(x).classList.add('hidden')});document.getElementById(id).classList.remove('hidden')}
function startSingle(){allQuestions=chooseQuestions();singleQs=allQuestions.filter(x=>x.type==='single');state={mode:'single',items:shuffle(singleQs),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function startMultiple(){state={mode:'multiple',items:shuffle(multiQs),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function startAll(){state={mode:'all',items:shuffle(allQuestions),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function header(x){var p=Math.round((state.i/state.items.length)*100);var label=x.type==='multiple'?'اختيار متعدد':'اختيار واحد';return '<div class="toprow"><span class="pill">'+label+'</span><span class="small">'+(state.i+1)+' / '+state.items.length+'</span></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div>'}
function render(){var x=state.items[state.i];if(x.type==='multiple')renderMulti(x);else renderSingle(x)}
function renderSingle(x){var opts=x.options.map(function(v,i){return {v:v,i:i}});opts=shuffle(opts);document.getElementById('quiz').innerHTML=header(x)+'<div class="q">'+x.question+'</div><div id="opts">'+opts.map(function(o){return '<button class="option" data-i="'+o.i+'">'+o.v+'</button>'}).join('')+'</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>';document.querySelectorAll('.option').forEach(function(el){el.onclick=function(){pickSingle(el,Number(el.dataset.i))}});document.getElementById('check').onclick=checkSingle}
function pickSingle(el,idx){if(state.checked)return;state.selected=idx;document.querySelectorAll('.option').forEach(function(n){n.classList.remove('selected')});el.classList.add('selected');document.getElementById('check').disabled=false}
function checkSingle(){if(state.selected===null||state.checked)return;state.checked=true;var x=state.items[state.i];var answer=x.correct[0];var ok=state.selected===answer;if(ok)state.score++;document.querySelectorAll('.option').forEach(function(el){var i=Number(el.dataset.i);if(i===answer)el.classList.add('correct');else if(i===state.selected&&!ok)el.classList.add('wrong');el.disabled=true});feedback(ok,x)}
function renderMulti(x){var opts=x.options.map(function(v,i){return {v:v,i:i}});opts=shuffle(opts);document.getElementById('quiz').innerHTML=header(x)+'<div class="small">اختر جميع الإجابات الصحيحة.</div><div class="q">'+x.question+'</div><div id="opts">'+opts.map(function(o){return '<button class="option" data-i="'+o.i+'">'+o.v+'</button>'}).join('')+'</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>';document.querySelectorAll('.option').forEach(function(el){el.onclick=function(){pickMulti(el,Number(el.dataset.i))}});document.getElementById('check').onclick=checkMulti}
function pickMulti(el,idx){if(state.checked)return;var k=state.selectedMany.indexOf(idx);if(k>=0){state.selectedMany.splice(k,1);el.classList.remove('selected')}else{state.selectedMany.push(idx);el.classList.add('selected')}document.getElementById('check').disabled=state.selectedMany.length===0}
function sameSet(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>=0})}
function checkMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;var x=state.items[state.i];var ok=sameSet(state.selectedMany,x.correct);if(ok)state.score++;document.querySelectorAll('.option').forEach(function(el){var i=Number(el.dataset.i);if(x.correct.indexOf(i)>=0)el.classList.add('correct');else if(state.selectedMany.indexOf(i)>=0)el.classList.add('wrong');el.disabled=true});feedback(ok,x)}
function feedback(ok,x){var correct=x.correct.map(function(i){return x.options[i]});document.getElementById('fb').innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'✅ إِجَابَةٌ صَحِيحَةٌ':'❌ إِجَابَةٌ خَاطِئَةٌ')+'<div class="explain">'+(ok?'':('الإِجَابَةُ الصَّحِيحَةُ:<br>• '+correct.join('<br>• ')+'<br>'))+x.explanation+'</div></div><button id="next" class="btn secondary" style="margin-top:12px">السؤال التالي</button>';document.getElementById('next').onclick=next;document.getElementById('check').classList.add('hidden')}
function next(){state.i++;state.selected=null;state.selectedMany=[];state.checked=false;if(state.i>=state.items.length)return finish();render()}
function finish(){show('result');document.getElementById('result').innerHTML='<h2>النتيجة</h2><div class="score">'+state.score+' / '+state.items.length+'</div><button id="restartBtn" class="btn">أعد التدريب</button><button id="homeBtn" class="btn ghost" style="margin-top:10px">الرجوع إلى القائمة</button>';document.getElementById('restartBtn').onclick=restartCurrent;document.getElementById('homeBtn').onclick=function(){show('home')}}
function restartCurrent(){if(state.mode==='single')startSingle();else if(state.mode==='multiple')startMultiple();else startAll()}
document.getElementById('pageTitle').textContent='النصوص الأدبية – '+(isLesson?lessonNames[selectedCourse]:'مراجعة الدروس ١–٥');
document.getElementById('pageSubtitle').textContent=isLesson?'مراجعة الواجبات المحددة وأسئلة الامتحان':'٣٠ سؤالًا: نقاط ملف الامتحان ثابتة، وبقية الأسئلة متجددة من الواجبات المحددة';
document.getElementById('questionCount').textContent=allQuestions.length;</script></body></html>
