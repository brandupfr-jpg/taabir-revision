const BANK=[{"id":1,"c":1,"ar":"مَا الْمُقَابَلَةُ؟","fr":"Quelle est la définition de la muqābala ?","opts":["أَنْ يُؤْتَى بِمَعْنَيَيْنِ مُتَوَافِقَيْنِ، أَوْ مَعَانٍ مُتَوَافِقَةٍ، ثُمَّ يُؤْتَى بِمَا يُقَابِلُ كُلَّ مَعْنًى عَلَى التَّرْتِيبِ.","إِلْحَاقُ أَمْرٍ بِأَمْرٍ فِي صِفَةٍ.","إِطْلَاقُ اللَّفْظِ وَإِرَادَةُ لَازِمِهِ.","ذِكْرُ الْعَامِّ بَعْدَ الْخَاصِّ."],"answer":0,"ex":"المقابلة : présenter plusieurs sens, puis leurs opposés dans le même ordre. La première proposition reprend la définition du livre.","important":true},{"id":2,"c":1,"ar":"مَا الْبَلَاغَةُ فِي «يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ»؟","fr":"Quel procédé rhétorique trouve-t-on dans cette expression ?","opts":["تَشْبِيهٌ","مُقَابَلَةٌ","كِنَايَةٌ","اسْتِعَارَةٌ"],"answer":1,"ex":"يأمرون / ينهون : ordonner / interdire ; المعروف / المنكر : le bien / le réprouvé. Deux oppositions dans le même ordre.","important":true},{"id":3,"c":1,"ar":"مَا الطِّبَاقُ؟","fr":"Qu’est-ce que le ṭibāq ?","opts":["ذِكْرُ الْخَاصِّ بَعْدَ الْعَامِّ.","حَذْفُ خَبَرِ الْمُبْتَدَإِ.","الْجَمْعُ بَيْنَ مَعْنَيَيْنِ مُتَقَابِلَيْنِ فِي كَلَامٍ وَاحِدٍ.","تَشْبِيهُ شَيْءٍ بِشَيْءٍ."],"answer":2,"ex":"Le livre définit le ṭibāq comme la réunion de deux sens opposés dans un même énoncé.","important":true},{"id":4,"c":1,"ar":"أَيْنَ الطِّبَاقُ فِي «تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ»؟","fr":"Quels mots forment l’opposition ?","opts":["وُجُوهٌ / وُجُوهٌ","تَبْيَضُّ / تَسْوَدُّ","تَبْيَضُّ / وُجُوهٌ","تَسْوَدُّ / وُجُوهٌ"],"answer":1,"ex":"Blanchir et noircir sont deux sens opposés.","important":true},{"id":5,"c":1,"ar":"مَا نَوْعُ الْقَصْرِ فِي «وَأُولَئِكَ هُمُ الْمُفْلِحُونَ» حَسَبَ الْكِتَابِ؟","fr":"Quel type de restriction le livre indique-t-il ?","opts":["قَصْرُ الْمَوْصُوفِ عَلَى الصِّفَةِ","تَشْبِيهٌ بَلِيغٌ","مَجَازٌ مُرْسَلٌ","قَصْرُ الصِّفَةِ عَلَى الْمَوْصُوفِ"],"answer":3,"ex":"Le livre indique قصر الصفة على الموصوف : la réussite est réservée aux personnes désignées.","important":true},{"id":6,"c":1,"ar":"عَلَى مَاذَا يَحُثُّ النَّصُّ فِي الدَّرْسِ الْأَوَّلِ؟","fr":"À quoi invite le texte du cours 1 ?","opts":["التَّفَرُّقِ","التَّمَسُّكِ بِالْإِسْلَامِ وَتَرْكِ التَّفَرُّقِ","تَرْكِ الدَّعْوَةِ","الِاخْتِلَافِ فِي الدِّينِ"],"answer":1,"ex":"Le texte appelle à s’attacher à l’islam et à éviter les divisions.","important":false},{"id":7,"c":2,"ar":"مَاذَا تُفِيدُ «مِنْ» الزَّائِدَةُ؟","fr":"Qu’exprime min supplémentaire ?","opts":["التَّبْعِيضَ","ابْتِدَاءَ الْغَايَةِ","التَّنْصِيصَ عَلَى الْعُمُومِ","الْمُقَارَنَةَ"],"answer":2,"ex":"التنصيص على العموم : elle exprime explicitement la généralité, sans exception.","important":true},{"id":8,"c":2,"ar":"مَا الَّذِي يَسْبِقُ «مِنْ» الزَّائِدَةَ؟","fr":"Quel contexte précède min supplémentaire selon le cours ?","opts":["نَفْيٌ أَوْ نَهْيٌ أَوِ اسْتِفْهَامٌ بِـ«هَلْ»","أَمْرٌ فَقَطْ","نِدَاءٌ فَقَطْ","قَسَمٌ فَقَطْ"],"answer":0,"ex":"Le livre mentionne la négation, l’interdiction ou l’interrogation avec هل.","important":true},{"id":9,"c":2,"ar":"كَيْفَ يَكُونُ مَجْرُورُ «مِنْ» الزَّائِدَةِ؟","fr":"Comment doit être le nom introduit par min supplémentaire ?","opts":["مَعْرِفَةً","ضَمِيرًا","اسْمَ إِشَارَةٍ","نَكِرَةً"],"answer":3,"ex":"Il doit être indéfini : نكرة. C’est la deuxième condition.","important":true},{"id":10,"c":2,"ar":"مَا نَوْعُ «مِنْ» فِي «وَمَا يَخْفَى عَلَى اللَّهِ مِنْ شَيْءٍ»؟","fr":"Quel est l’emploi de min dans cette phrase ?","opts":["تَبْعِيضِيَّةٌ","زَائِدَةٌ","لِبَيَانِ الْجِنْسِ","لِابْتِدَاءِ الْغَايَةِ"],"answer":1,"ex":"La négation ما précède min et شيء est indéfini : absolument rien n’échappe à Allah.","important":true},{"id":11,"c":2,"ar":"لِمَاذَا حُذِفَتِ النُّونُ فِي «وَالِدَيَّ»؟","fr":"Pourquoi le nūn du duel est-il supprimé dans wālidayya ?","opts":["لِلْجَزْمِ","لِلنَّفْيِ","لِلْإِضَافَةِ","لِلِاسْتِفْهَامِ"],"answer":2,"ex":"Le duel perd son nūn dans l’annexion. Ici, il est annexé au pronom ياء المتكلم.","important":false},{"id":12,"c":2,"ar":"مَا تَقْدِيرُ الْكَلَامِ فِي «وَإِذْ قَالَ إِبْرَاهِيمُ»؟","fr":"Quel verbe sous-entendu explique إذ selon le livre ?","opts":["اُذْكُرْ إِذْ قَالَ إِبْرَاهِيمُ","اُكْتُبْ إِبْرَاهِيمَ","لَا تَقُلْ","لَنْ يَقُولَ"],"answer":0,"ex":"Le livre restitue اُذْكُرْ : « rappelle-toi lorsque Ibrāhīm dit… ».","important":false},{"id":13,"c":3,"ar":"مَا التَّشْبِيهُ؟","fr":"Quelle est la définition de la comparaison ?","opts":["الْجَمْعُ بَيْنَ ضِدَّيْنِ.","إِلْحَاقُ أَمْرٍ بِأَمْرٍ فِي صِفَةٍ بِإِحْدَى أَدَوَاتِ التَّشْبِيهِ.","إِطْلَاقُ اللَّفْظِ وَإِرَادَةُ لَازِمِهِ.","حَذْفُ الْفَاعِلِ."],"answer":1,"ex":"Définition du livre : rapprocher une chose d’une autre dans une qualité, au moyen d’un outil de comparaison.","important":true},{"id":14,"c":3,"ar":"كَمْ عَدَدُ أَرْكَانِ التَّشْبِيهِ؟","fr":"Combien d’éléments comporte la comparaison ?","opts":["اثْنَانِ","ثَلَاثَةٌ","أَرْبَعَةٌ","خَمْسَةٌ"],"answer":2,"ex":"المشبّه، المشبّه به، أداة التشبيه، وجه الشبه : le comparé, le comparant, l’outil et la qualité commune.","important":true},{"id":15,"c":3,"ar":"مَا الْمُشَبَّهُ فِي «مُحَمَّدٌ كَالْأَسَدِ فِي الشَّجَاعَةِ»؟","fr":"Quel est le comparé ?","opts":["مُحَمَّدٌ","الْأَسَدُ","الْكَافُ","الشَّجَاعَةُ"],"answer":0,"ex":"Muḥammad est comparé au lion. Il est donc المشبّه.","important":true},{"id":16,"c":3,"ar":"مَا وَجْهُ الشَّبَهِ فِي «مُحَمَّدٌ كَالْأَسَدِ فِي الشَّجَاعَةِ»؟","fr":"Quelle est la qualité commune ?","opts":["مُحَمَّدٌ","الْكَافُ","الْأَسَدُ","الشَّجَاعَةُ"],"answer":3,"ex":"La qualité commune est le courage : الشجاعة.","important":true},{"id":17,"c":3,"ar":"مَا الْمَفْعُولُ لِأَجْلِهِ؟","fr":"Qu’exprime le complément de cause ?","opts":["اسْمٌ يَدُلُّ عَلَى الْمَكَانِ.","اسْمٌ يُذْكَرُ لِبَيَانِ سَبَبِ الْفِعْلِ.","اسْمٌ يَدُلُّ عَلَى الْعَدَدِ.","اسْمٌ يَدُلُّ عَلَى الْفَاعِلِ."],"answer":1,"ex":"Le livre le définit comme un nom mentionné pour expliquer la cause de l’action.","important":true},{"id":18,"c":3,"ar":"لِمَاذَا جَازَ الِابْتِدَاءُ بِـ«قَوْلٌ» فِي «قَوْلٌ مَعْرُوفٌ»؟","fr":"Pourquoi peut-on commencer par le nom indéfini qawl ?","opts":["لِأَنَّهُ عَلَمٌ","لِأَنَّهُ ضَمِيرٌ","لِأَنَّهُ مَوْصُوفٌ","لِأَنَّهُ فِعْلٌ"],"answer":2,"ex":"Le nom indéfini est qualifié par معروف, ce qui permet ici son emploi comme sujet initial.","important":false},{"id":19,"c":4,"ar":"مَتَى تَكُونُ «أَصْبَحَ» تَامَّةً؟","fr":"Quand aṣbaḥa est-il un verbe complet ?","opts":["إِذَا اكْتَفَتْ بِمَرْفُوعِهَا وَلَمْ تَحْتَجْ إِلَى خَبَرٍ.","إِذَا نَصَبَتْ مَفْعُولَيْنِ.","إِذَا احْتَاجَتْ إِلَى اسْمٍ وَخَبَرٍ.","إِذَا كَانَتْ حَرْفَ جَرٍّ."],"answer":0,"ex":"Elle se suffit de son sujet et n’a pas besoin d’un attribut. Elle signifie alors « entrer dans le matin ».","important":true},{"id":20,"c":4,"ar":"مَا مَعْنَى «أَصْبَحَ» التَّامَّةِ؟","fr":"Que signifie aṣbaḥa employé comme verbe complet ?","opts":["نَامَ","خَرَجَ","دَخَلَ فِي الصَّبَاحِ","دَخَلَ فِي الْمَسَاءِ"],"answer":2,"ex":"أصبح تامة signifie دخل في الصباح : entrer dans le matin.","important":true},{"id":21,"c":4,"ar":"مَا مَعْنَى «أَمْسَى» التَّامَّةِ؟","fr":"Que signifie amsā employé comme verbe complet ?","opts":["دَخَلَ فِي الصَّبَاحِ","دَخَلَ فِي الْمَسَاءِ","اسْتَيْقَظَ","سَافَرَ"],"answer":1,"ex":"أمسى تامة signifie entrer dans le soir.","important":true},{"id":22,"c":4,"ar":"مَا نَوْعُ «أَصْبَحَ» فِي «أَصْبَحَ الْجَوُّ بَارِدًا»؟","fr":"Quel est l’emploi de aṣbaḥa ici ?","opts":["تَامَّةٌ","حَرْفٌ","فِعْلُ أَمْرٍ","نَاقِصَةٌ"],"answer":3,"ex":"الجوّ est son nom et باردًا son attribut : أصبح est ici ناقصة.","important":true},{"id":23,"c":4,"ar":"مَا إِعْرَابُ «بَارِدًا» فِي «أَصْبَحَ الْجَوُّ بَارِدًا»؟","fr":"Quelle est la fonction de bāridan ?","opts":["خَبَرُ أَصْبَحَ مَنْصُوبٌ","فَاعِلٌ مَرْفُوعٌ","مُضَافٌ إِلَيْهِ","اسْمُ أَصْبَحَ"],"answer":0,"ex":"باردًا est l’attribut de أصبح, à l’accusatif.","important":false},{"id":24,"c":4,"ar":"مَا الْفَرْقُ بَيْنَ «أَصْبَحَ» التَّامَّةِ وَالنَّاقِصَةِ؟","fr":"Quelle différence grammaticale les distingue ?","opts":["كِلَاهُمَا تَحْتَاجُ إِلَى مَفْعُولَيْنِ.","التَّامَّةُ تَحْتَاجُ إِلَى خَبَرٍ.","التَّامَّةُ تَكْتَفِي بِفَاعِلٍ، وَالنَّاقِصَةُ لَهَا اسْمٌ وَخَبَرٌ.","النَّاقِصَةُ لَا اسْمَ لَهَا."],"answer":2,"ex":"Le verbe complet a un sujet ; l’emploi ناقصة construit un nom et un attribut.","important":true},{"id":25,"c":5,"ar":"مَا الْكِنَايَةُ؟","fr":"Quelle est la définition de la kināya ?","opts":["تَشْبِيهُ أَمْرٍ بِأَمْرٍ.","أَنْ تُطْلِقَ اللَّفْظَ وَتُرِيدَ لَازِمَهُ.","الْجَمْعُ بَيْنَ ضِدَّيْنِ.","تَكْرَارُ اللَّفْظِ."],"answer":1,"ex":"Définition du livre : employer un terme en visant ce qu’il implique.","important":true},{"id":26,"c":5,"ar":"عَمَّ تُكَنِّي «رَطْبَةٍ» فِي «كَبِدٍ رَطْبَةٍ»؟","fr":"Que suggère « humide » dans cette expression ?","opts":["الْمَوْتِ","الْغِنَى","السَّفَرِ","الْحَيَاةِ"],"answer":3,"ex":"L’humidité du foie évoque la vie : كناية عن الحياة.","important":true},{"id":27,"c":5,"ar":"مَا عِلَاقَةُ الْمَجَازِ فِي إِطْلَاقِ «الْكَبِدِ» وَإِرَادَةِ الْحَيَوَانِ الْحَيِّ؟","fr":"Quel lien unit le foie à l’être vivant désigné ?","opts":["الْجُزْئِيَّةُ","السَّبَبِيَّةُ","الْمُشَابَهَةُ","الزَّمَانِيَّةُ"],"answer":0,"ex":"Le foie est une partie de l’animal. Le mot désigne le tout par une partie : الجزئية.","important":true},{"id":28,"c":5,"ar":"مَا إِعْرَابُ «مَاءً» فِي «فَمَلَأَ خُفَّهُ مَاءً»؟","fr":"Quelle est la fonction de māʾan ?","opts":["فَاعِلٌ","مُبْتَدَأٌ","تَمْيِيزٌ","خَبَرٌ"],"answer":2,"ex":"ماءً est un tamyīz : il précise de quoi la chaussure a été remplie.","important":true},{"id":29,"c":5,"ar":"مَاذَا تُفِيدُ «إِذَا» فِي «فَإِذَا كَلْبٌ يَلْهَثُ»؟","fr":"Qu’exprime idhā ici ?","opts":["الشَّرْطَ","الْمُفَاجَأَةَ","النَّفْيَ","التَّمَنِّيَ"],"answer":1,"ex":"إذا الفجائية exprime la survenue inattendue d’un événement.","important":true},{"id":30,"c":5,"ar":"مَاذَا تُفِيدُ «فِي» فِي «وَإِنَّ لَنَا فِي الْبَهَائِمِ أَجْرًا»؟","fr":"Quelle valeur a fī dans cette question du hadith ?","opts":["الزَّمَانَ","الْمَكَانَ فَقَطْ","الْمُقَارَنَةَ","السَّبَبِيَّةَ"],"answer":3,"ex":"في indique ici la cause : une récompense pour le bien fait aux animaux.","important":false}];

function start(){pool=selected?shuffle(BANK.filter(q=>q.c===selected)):shuffle([1,2,3,4,5].flatMap(c=>shuffle(BANK.filter(q=>q.c===c&&q.important)).slice(0,4)));pos=0;score=0;answers=[];$('title').textContent=selected?'الدَّرْسُ '+['','الْأَوَّلُ','الثَّانِي','الثَّالِثُ','الرَّابِعُ','الْخَامِسُ'][selected]+' · Cours '+selected:'الدُّرُوسُ ١–٥ · QCM mélangé';render()}
function element(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function french(text){return element('p',text,'fr'+(showFrench?'':' hidden'))}
function render(){let q=pool[pos];$('count').textContent=(pos+1)+' / '+pool.length;$('score').textContent='النَّتِيجَةُ : '+score;$('bar').style.width=(pos/pool.length*100)+'%';let root=$('content');root.replaceChildren();root.append(element('p','الدَّرْسُ '+q.c,'small'),element('h2',q.ar),french(q.fr));let opts=element('div','','options');root.append(opts);shuffle(q.opts.map((label,id)=>({label,id}))).forEach((o,i)=>{let b=element('button',String.fromCharCode(65+i)+' · '+o.label,'option');b.type='button';b.dataset.choice=o.id;b.onclick=()=>answer(o.id,opts,q);opts.append(b)})}
function answer(id,opts,q){let ok=id===q.answer;if(ok)score++;answers.push({q,chosen:id,ok});opts.querySelectorAll('button').forEach(b=>{b.disabled=true;let n=Number(b.dataset.choice);if(n===q.answer)b.classList.add('correct');if(n===id&&!ok)b.classList.add('wrong')});$('score').textContent='النَّتِيجَةُ : '+score;let f=element('div','','feedback');f.append(element('strong',ok?'إِجَابَةٌ صَحِيحَةٌ ✓':'الإِجَابَةُ الصَّحِيحَةُ :'),element('p',q.opts[q.answer]),french(q.ex));let next=element('button',pos+1<pool.length?'السُّؤَالُ التَّالِي · Suivant':'النَّتِيجَةُ · Résultat','next');next.onclick=()=>{pos++;if(pos<pool.length)render();else finish()};$('content').append(f,next);next.focus()}
function finish(){$('bar').style.width='100%';$('count').textContent=pool.length+' / '+pool.length;let root=$('content');root.replaceChildren(element('h2','النَّتِيجَةُ : '+score+' / '+pool.length),french('Relis les corrections ci-dessous ou recommence pour mélanger les questions et les choix.'));let wrong=answers.filter(a=>!a.ok);if(wrong.length){let retry=element('button','مُرَاجَعَةُ الْأَخْطَاءِ · Refaire mes erreurs','next');retry.onclick=()=>{pool=shuffle(wrong.map(a=>a.q));pos=0;score=0;answers=[];render()};root.append(retry)}answers.forEach(a=>{let d=element('div','','review');d.append(element('p',(a.ok?'✓ ':'✗ ')+a.q.ar),element('p','الإِجَابَةُ : '+a.q.opts[a.q.answer]),french(a.q.ex));root.append(d)})}
$('translation').onclick=()=>{showFrench=!showFrench;document.querySelectorAll('.fr').forEach(e=>e.classList.toggle('hidden',!showFrench));$('translation').textContent='Français : '+(showFrench?'affiché':'masqué');$('translation').setAttribute('aria-pressed',String(showFrench))};$('restart').onclick=start;start();
</script></body></html>
