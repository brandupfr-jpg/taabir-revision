*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#234c39,#3c7659);color:#fff;padding:24px 20px;border-radius:24px;box-shadow:0 10px 30px rgba(31,42,36,.12)}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.9}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(31,42,36,.06)}.menu{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%}.btn.secondary{background:var(--accent2);color:var(--accent)}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn:disabled{opacity:.5}.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);padding:14px;border-radius:14px;margin:10px 0;font-size:17px;cursor:pointer;line-height:1.8}.option.selected{border-color:var(--accent);background:#f0f6f2}.option.correct{border-color:var(--good);background:#eef8f2}.option.wrong{border-color:var(--bad);background:#fff0f0}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:14px;color:var(--muted)}.progress{height:9px;background:#e8ece9;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.q{font-size:22px;font-weight:800;margin:6px 0 12px;line-height:1.9}.feedback{padding:13px 14px;border-radius:14px;margin-top:14px;font-weight:700}.feedback.good{background:#eef8f2;color:var(--good)}.feedback.bad{background:#fff0f0;color:var(--bad)}.explain{font-weight:500;color:var(--ink);margin-top:6px}.hidden{display:none!important}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}.score{font-size:42px;font-weight:900;color:var(--accent);text-align:center;margin:18px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.navline{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.navlink{color:var(--accent);text-decoration:none;font-weight:800;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f6f8f6;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}@media(max-width:600px){.hero h1{font-size:24px}.q{font-size:20px}.stats{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="navline"><a class="navlink" href="index.html#nusus">النصوص الأدبية</a><a class="navlink" href="index.html">الرئيسية</a></div><section class="hero"><h1 id="pageTitle">النصوص الأدبية</h1><p id="pageSubtitle"></p></section><section id="home" class="card"><div class="pill">تدريب قريب من نمط الاختبار الحقيقي</div><p><b>أسئلة في قواعد الكتاب، مع الاهتمام بالأسئلة التي حدّدها الأستاذ.</b></p><div class="stats"><div class="stat"><b id="questionCount"></b><span>اختيار واحد</span></div></div><div class="menu"><button class="btn" onclick="startSingle()">ابدأ التدريب</button><a class="btn ghost" href="index.html#nusus" style="text-decoration:none;text-align:center">الرجوع إلى دروس النصوص الأدبية</a></div></section><section id="quiz" class="card hidden"></section><section id="result" class="card hidden"></section><div class="footer">النصوص الأدبية – المستوى الرابع</div></div><script>const bank=[{"id":1,"c":1,"important":true,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"مَا الْمُقَابَلَةُ؟","options":["أَنْ يُؤْتَى بِمَعْنَيَيْنِ مُتَوَافِقَيْنِ، أَوْ مَعَانٍ مُتَوَافِقَةٍ، ثُمَّ يُؤْتَى بِمَا يُقَابِلُ كُلَّ مَعْنًى عَلَى التَّرْتِيبِ.","إِلْحَاقُ أَمْرٍ بِأَمْرٍ فِي صِفَةٍ.","إِطْلَاقُ اللَّفْظِ وَإِرَادَةُ لَازِمِهِ.","ذِكْرُ الْعَامِّ بَعْدَ الْخَاصِّ."],"correct":[0],"explanation":"الْمُقَابَلَةُ: أَنْ يُؤْتَى بِمَعْنَيَيْنِ مُتَوَافِقَيْنِ، أَوْ مَعَانٍ مُتَوَافِقَةٍ، ثُمَّ يُؤْتَى بِمَا يُقَابِلُ كُلَّ مَعْنًى عَلَى التَّرْتِيبِ."},{"id":2,"c":1,"important":true,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"مَا الْبَلَاغَةُ فِي «يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ»؟","options":["تَشْبِيهٌ","مُقَابَلَةٌ","كِنَايَةٌ","اسْتِعَارَةٌ"],"correct":[1],"explanation":"«يَأْمُرُونَ» يُقَابِلُ «يَنْهَوْنَ»، وَ«الْمَعْرُوفُ» يُقَابِلُ «الْمُنْكَرُ»."},{"id":3,"c":1,"important":true,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"مَا الطِّبَاقُ؟","options":["ذِكْرُ الْخَاصِّ بَعْدَ الْعَامِّ.","حَذْفُ خَبَرِ الْمُبْتَدَإِ.","الْجَمْعُ بَيْنَ مَعْنَيَيْنِ مُتَقَابِلَيْنِ فِي كَلَامٍ وَاحِدٍ.","تَشْبِيهُ شَيْءٍ بِشَيْءٍ."],"correct":[2],"explanation":"الطِّبَاقُ: الْجَمْعُ بَيْنَ مَعْنَيَيْنِ مُتَقَابِلَيْنِ فِي كَلَامٍ وَاحِدٍ."},{"id":4,"c":1,"important":true,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"أَيْنَ الطِّبَاقُ فِي «تَبْيَضُّ وُجُوهٌ وَتَسْوَدُّ وُجُوهٌ»؟","options":["وُجُوهٌ / وُجُوهٌ","تَبْيَضُّ / تَسْوَدُّ","تَبْيَضُّ / وُجُوهٌ","تَسْوَدُّ / وُجُوهٌ"],"correct":[1],"explanation":"«تَبْيَضُّ» وَ«تَسْوَدُّ» مَعْنَيَانِ مُتَقَابِلَانِ."},{"id":5,"c":1,"important":true,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"مَا نَوْعُ الْقَصْرِ فِي «وَأُولَئِكَ هُمُ الْمُفْلِحُونَ» حَسَبَ الْكِتَابِ؟","options":["قَصْرُ الْمَوْصُوفِ عَلَى الصِّفَةِ","تَشْبِيهٌ بَلِيغٌ","مَجَازٌ مُرْسَلٌ","قَصْرُ الصِّفَةِ عَلَى الْمَوْصُوفِ"],"correct":[3],"explanation":"هُوَ قَصْرُ الصِّفَةِ عَلَى الْمَوْصُوفِ؛ إِذْ قَصَرَ الْفَلَاحَ عَلَيْهِمْ."},{"id":6,"c":1,"important":false,"lesson":"الدَّرْسُ الْأَوَّلُ","type":"single","question":"عَلَى مَاذَا يَحُثُّ النَّصُّ فِي الدَّرْسِ الْأَوَّلِ؟","options":["التَّفَرُّقِ","التَّمَسُّكِ بِالْإِسْلَامِ وَتَرْكِ التَّفَرُّقِ","تَرْكِ الدَّعْوَةِ","الِاخْتِلَافِ فِي الدِّينِ"],"correct":[1],"explanation":"يَأْمُرُ النَّصُّ بِالتَّمَسُّكِ بِالْإِسْلَامِ، وَيَنْهَى عَنِ التَّفَرُّقِ وَالِاخْتِلَافِ فِي الدِّينِ."},{"id":7,"c":2,"important":true,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"مَاذَا تُفِيدُ «مِنْ» الزَّائِدَةُ؟","options":["التَّبْعِيضَ","ابْتِدَاءَ الْغَايَةِ","التَّنْصِيصَ عَلَى الْعُمُومِ","الْمُقَارَنَةَ"],"correct":[2],"explanation":"تُفِيدُ «مِنْ» الزَّائِدَةُ التَّنْصِيصَ عَلَى الْعُمُومِ."},{"id":8,"c":2,"important":true,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"مَا الَّذِي يَسْبِقُ «مِنْ» الزَّائِدَةَ؟","options":["نَفْيٌ أَوْ نَهْيٌ أَوِ اسْتِفْهَامٌ بِـ«هَلْ»","أَمْرٌ فَقَطْ","نِدَاءٌ فَقَطْ","قَسَمٌ فَقَطْ"],"correct":[0],"explanation":"يُشْتَرَطُ أَنْ يَسْبِقَهَا نَفْيٌ أَوْ نَهْيٌ أَوِ اسْتِفْهَامٌ بِـ«هَلْ»."},{"id":9,"c":2,"important":true,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"كَيْفَ يَكُونُ مَجْرُورُ «مِنْ» الزَّائِدَةِ؟","options":["مَعْرِفَةً","ضَمِيرًا","اسْمَ إِشَارَةٍ","نَكِرَةً"],"correct":[3],"explanation":"يُشْتَرَطُ أَنْ يَكُونَ مَجْرُورُهَا نَكِرَةً."},{"id":10,"c":2,"important":true,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"مَا نَوْعُ «مِنْ» فِي «وَمَا يَخْفَى عَلَى اللَّهِ مِنْ شَيْءٍ»؟","options":["تَبْعِيضِيَّةٌ","زَائِدَةٌ","لِبَيَانِ الْجِنْسِ","لِابْتِدَاءِ الْغَايَةِ"],"correct":[1],"explanation":"«مِنْ» زَائِدَةٌ؛ سَبَقَهَا نَفْيٌ، وَمَجْرُورُهَا «شَيْءٍ» نَكِرَةٌ."},{"id":11,"c":2,"important":false,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"لِمَاذَا حُذِفَتِ النُّونُ فِي «وَالِدَيَّ»؟","options":["لِلْجَزْمِ","لِلنَّفْيِ","لِلْإِضَافَةِ","لِلِاسْتِفْهَامِ"],"correct":[2],"explanation":"حُذِفَتْ نُونُ الْمُثَنَّى لِلْإِضَافَةِ إِلَى يَاءِ الْمُتَكَلِّمِ."},{"id":12,"c":2,"important":false,"lesson":"الدَّرْسُ الثَّانِي","type":"single","question":"مَا تَقْدِيرُ الْكَلَامِ فِي «وَإِذْ قَالَ إِبْرَاهِيمُ»؟","options":["اُذْكُرْ إِذْ قَالَ إِبْرَاهِيمُ","اُكْتُبْ إِبْرَاهِيمَ","لَا تَقُلْ","لَنْ يَقُولَ"],"correct":[0],"explanation":"التَّقْدِيرُ: اُذْكُرْ إِذْ قَالَ إِبْرَاهِيمُ؛ فَـ«إِذْ» هُنَا مَفْعُولٌ بِهِ."},{"id":13,"c":3,"important":true,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"مَا التَّشْبِيهُ؟","options":["الْجَمْعُ بَيْنَ ضِدَّيْنِ.","إِلْحَاقُ أَمْرٍ بِأَمْرٍ فِي صِفَةٍ بِإِحْدَى أَدَوَاتِ التَّشْبِيهِ.","إِطْلَاقُ اللَّفْظِ وَإِرَادَةُ لَازِمِهِ.","حَذْفُ الْفَاعِلِ."],"correct":[1],"explanation":"التَّشْبِيهُ: إِلْحَاقُ أَمْرٍ بِأَمْرٍ فِي صِفَةٍ بِإِحْدَى أَدَوَاتِ التَّشْبِيهِ."},{"id":14,"c":3,"important":true,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"كَمْ عَدَدُ أَرْكَانِ التَّشْبِيهِ؟","options":["اثْنَانِ","ثَلَاثَةٌ","أَرْبَعَةٌ","خَمْسَةٌ"],"correct":[2],"explanation":"أَرْكَانُهُ: الْمُشَبَّهُ، وَالْمُشَبَّهُ بِهِ، وَأَدَاةُ التَّشْبِيهِ، وَوَجْهُ الشَّبَهِ."},{"id":15,"c":3,"important":true,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"مَا الْمُشَبَّهُ فِي «مُحَمَّدٌ كَالْأَسَدِ فِي الشَّجَاعَةِ»؟","options":["مُحَمَّدٌ","الْأَسَدُ","الْكَافُ","الشَّجَاعَةُ"],"correct":[0],"explanation":"«مُحَمَّدٌ» هُوَ الْمُشَبَّهُ، وَ«الْأَسَدُ» هُوَ الْمُشَبَّهُ بِهِ."},{"id":16,"c":3,"important":true,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"مَا وَجْهُ الشَّبَهِ فِي «مُحَمَّدٌ كَالْأَسَدِ فِي الشَّجَاعَةِ»؟","options":["مُحَمَّدٌ","الْكَافُ","الْأَسَدُ","الشَّجَاعَةُ"],"correct":[3],"explanation":"وَجْهُ الشَّبَهِ هُوَ الصِّفَةُ الْمُشْتَرَكَةُ، وَهِيَ الشَّجَاعَةُ."},{"id":17,"c":3,"important":true,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"مَا الْمَفْعُولُ لِأَجْلِهِ؟","options":["اسْمٌ يَدُلُّ عَلَى الْمَكَانِ.","اسْمٌ يُذْكَرُ لِبَيَانِ سَبَبِ الْفِعْلِ.","اسْمٌ يَدُلُّ عَلَى الْعَدَدِ.","اسْمٌ يَدُلُّ عَلَى الْفَاعِلِ."],"correct":[1],"explanation":"الْمَفْعُولُ لِأَجْلِهِ اسْمٌ يُذْكَرُ لِبَيَانِ سَبَبِ الْفِعْلِ."},{"id":18,"c":3,"important":false,"lesson":"الدَّرْسُ الثَّالِثُ","type":"single","question":"لِمَاذَا جَازَ الِابْتِدَاءُ بِـ«قَوْلٌ» فِي «قَوْلٌ مَعْرُوفٌ»؟","options":["لِأَنَّهُ عَلَمٌ","لِأَنَّهُ ضَمِيرٌ","لِأَنَّهُ مَوْصُوفٌ","لِأَنَّهُ فِعْلٌ"],"correct":[2],"explanation":"جَازَ الِابْتِدَاءُ بِالنَّكِرَةِ لِأَنَّهَا مَوْصُوفَةٌ بِـ«مَعْرُوفٌ»."},{"id":19,"c":4,"important":true,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَتَى تَكُونُ «أَصْبَحَ» تَامَّةً؟","options":["إِذَا اكْتَفَتْ بِمَرْفُوعِهَا وَلَمْ تَحْتَجْ إِلَى خَبَرٍ.","إِذَا نَصَبَتْ مَفْعُولَيْنِ.","إِذَا احْتَاجَتْ إِلَى اسْمٍ وَخَبَرٍ.","إِذَا كَانَتْ حَرْفَ جَرٍّ."],"correct":[0],"explanation":"تَكُونُ تَامَّةً إِذَا اكْتَفَتْ بِمَرْفُوعِهَا وَلَمْ تَحْتَجْ إِلَى خَبَرٍ، وَمَعْنَاهَا: دَخَلَ فِي الصَّبَاحِ."},{"id":20,"c":4,"important":true,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَا مَعْنَى «أَصْبَحَ» التَّامَّةِ؟","options":["نَامَ","خَرَجَ","دَخَلَ فِي الصَّبَاحِ","دَخَلَ فِي الْمَسَاءِ"],"correct":[2],"explanation":"مَعْنَى «أَصْبَحَ» التَّامَّةِ: دَخَلَ فِي الصَّبَاحِ."},{"id":21,"c":4,"important":true,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَا مَعْنَى «أَمْسَى» التَّامَّةِ؟","options":["دَخَلَ فِي الصَّبَاحِ","دَخَلَ فِي الْمَسَاءِ","اسْتَيْقَظَ","سَافَرَ"],"correct":[1],"explanation":"مَعْنَى «أَمْسَى» التَّامَّةِ: دَخَلَ فِي الْمَسَاءِ."},{"id":22,"c":4,"important":true,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَا نَوْعُ «أَصْبَحَ» فِي «أَصْبَحَ الْجَوُّ بَارِدًا»؟","options":["تَامَّةٌ","حَرْفٌ","فِعْلُ أَمْرٍ","نَاقِصَةٌ"],"correct":[3],"explanation":"«أَصْبَحَ» نَاقِصَةٌ؛ «الْجَوُّ» اسْمُهَا، وَ«بَارِدًا» خَبَرُهَا."},{"id":23,"c":4,"important":false,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَا إِعْرَابُ «بَارِدًا» فِي «أَصْبَحَ الْجَوُّ بَارِدًا»؟","options":["خَبَرُ أَصْبَحَ مَنْصُوبٌ","فَاعِلٌ مَرْفُوعٌ","مُضَافٌ إِلَيْهِ","اسْمُ أَصْبَحَ"],"correct":[0],"explanation":"«بَارِدًا» خَبَرُ أَصْبَحَ مَنْصُوبٌ، وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ."},{"id":24,"c":4,"important":true,"lesson":"الدَّرْسُ الرَّابِعُ","type":"single","question":"مَا الْفَرْقُ بَيْنَ «أَصْبَحَ» التَّامَّةِ وَالنَّاقِصَةِ؟","options":["كِلَاهُمَا تَحْتَاجُ إِلَى مَفْعُولَيْنِ.","التَّامَّةُ تَحْتَاجُ إِلَى خَبَرٍ.","التَّامَّةُ تَكْتَفِي بِفَاعِلٍ، وَالنَّاقِصَةُ لَهَا اسْمٌ وَخَبَرٌ.","النَّاقِصَةُ لَا اسْمَ لَهَا."],"correct":[2],"explanation":"التَّامَّةُ تَكْتَفِي بِفَاعِلٍ، وَالنَّاقِصَةُ تَحْتَاجُ إِلَى اسْمٍ وَخَبَرٍ."},{"id":25,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"مَا الْكِنَايَةُ؟","options":["تَشْبِيهُ أَمْرٍ بِأَمْرٍ.","أَنْ تُطْلِقَ اللَّفْظَ وَتُرِيدَ لَازِمَهُ.","الْجَمْعُ بَيْنَ ضِدَّيْنِ.","تَكْرَارُ اللَّفْظِ."],"correct":[1],"explanation":"الْكِنَايَةُ: أَنْ تُطْلِقَ اللَّفْظَ وَتُرِيدَ لَازِمَهُ."},{"id":26,"c":5," أَحْيَاهُ اللَّهُ: جَعَلَهُ حَيًّا."},{"id":96,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"مَا مَعْنَى «لَهِثَ الْكَلْبُ»؟","options":["أَخْرَجَ لِسَانَهُ مِنْ حَرٍّ أَوْ عَطَشٍ.","نَامَ مِنَ التَّعَبِ.","جَرَى خَلْفَ الرَّجُلِ.","أَكَلَ حَتَّى شَبِعَ."],"correct":[0],"explanation":"لَهِثَ الْكَلْبُ: أَخْرَجَ لِسَانَهُ مِنْ حَرٍّ أَوْ عَطَشٍ."},{"id":97,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"مَا مُفْرَدُ «بَهَائِمَ»؟","options":["بَهْمٌ","بَهِيمَةٌ","بَهْمَةٌ","بُهْمٌ"],"correct":[1],"explanation":"مُفْرَدُ بَهَائِمَ: بَهِيمَةٌ."},{"id":98,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"مَا نَوْعُ «بَيْنَمَا» فِي «بَيْنَمَا رَجُلٌ يَمْشِي بِطَرِيقٍ»؟","options":["حَرْفُ نَفْيٍ","حَرْفُ اسْتِفْهَامٍ","ظَرْفُ زَمَانٍ","حَرْفُ جَرٍّ"],"correct":[2],"explanation":"«بَيْنَمَا» ظَرْفٌ لِلزَّمَانِ الْمَاضِي، كَمَا بَيَّنَ الْكِتَابُ."},{"id":99,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"أَيُّ جُمْلَةٍ تَدْخُلُ عَلَيْهَا «إِذَا» الْفُجَائِيَّةُ؟","options":["الْجُمْلَةُ الْفِعْلِيَّةُ فَقَطْ","جُمْلَةُ الْأَمْرِ","جُمْلَةُ النَّهْيِ","الْجُمْلَةُ الِاسْمِيَّةُ"],"correct":[3],"explanation":"مِثَالُهَا: «فَإِذَا كَلْبٌ يَلْهَثُ»؛ وَلَا تَدْخُلُ عَلَى الْجُمْلَةِ الْفِعْلِيَّةِ."},{"id":100,"c":5,"important":true,"lesson":"الدَّرْسُ الْخَامِسُ","type":"single","question":"مَا أَهَمُّ مَا يُسْتَفَادُ مِنَ الْحَدِيثِ؟","options":["الرَّحْمَةُ تَشْمَلُ الْحَيَوَانَ، وَفِي الْإِحْسَانِ إِلَيْهِ أَجْرٌ.","الرَّحْمَةُ تَخُصُّ الْإِنْسَانَ وَحْدَهُ.","لَا أَجْرَ فِي سَقْيِ الْحَيَوَانِ.","يُجْزَى الْإِنْسَانُ عَلَى الْقَوْلِ فَقَطْ."],"correct":[0],"explanation":"يَجْزِي اللَّهُ الْإِنْسَانَ عَلَى رَحْمَتِهِ غَيْرَهُ وَلَوْ كَانَ حَيَوَانًا."}];
const selectedCourse=Number(new URLSearchParams(location.search).get('course'));
const isLesson=[1,2,3,4,5].includes(selectedCourse);
const lessonNames=["","الدَّرْسُ الْأَوَّلُ","الدَّرْسُ الثَّانِي","الدَّرْسُ الثَّالِثُ","الدَّرْسُ الرَّابِعُ","الدَّرْسُ الْخَامِسُ"];
function chooseQuestions(){return isLesson?bank.filter(x=>x.c===selectedCourse):[1,2,3,4,5].flatMap(c=>shuffle(bank.filter(x=>x.c===c)).slice(0,6))}
let allQuestions=chooseQuestions();
let singleQs=allQuestions.filter(x=>x.type==='single');
const multiQs=[];
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
var state={mode:'',items:[],i:0,score:0,selected:null,selectedMany:[],checked:false};
function show(id){['home','quiz','result'].forEach(function(x){document.getElementById(x).classList.add('hidden')});document.getElementById(id).classList.remove('hidden')}
function startSingle(){allQuestions=chooseQuestions();singleQs=allQuestions.filter(x=>x.type==='single');state={mode:'single',items:shuffle(singleQs),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function startMultiple(){state={mode:'multiple',items:shuffle(multiQs),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function startAll(){state={mode:'all',items:shuffle(allQuestions),i:0,score:0,selected:null,selectedMany:[],checked:false};show('quiz');render()}
function header(x){var p=Math.round((state.i/state.items.length)*100);var label=x.type==='multiple'?'اختيار متعدد':'اختيار واحد';return '<div class="toprow"><span class="pill">'+label+'</span><span class="small">'+(state.i+1)+' / '+state.items.length+'</span></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div>'}
function render(){var x=state.items[state.i];if(x.type==='multiple')renderMulti(x);else renderSingle(x)}
function renderSingle(x){var opts=x.options.map(function(v,i){return {v:v,i:i}});opts=shuffle(opts);document.getElementById('quiz').innerHTML=header(x)+'<div class="q">'+x.question+'</div><div id="opts">'+opts.map(function(o){return '<button class="option" data-i="'+o.i+'">'+o.v+'</button>'}).join('')+'</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>';document.querySelectorAll('.option').forEach(function(el){el.onclick=function(){pickSingle(el,Number(el.dataset.i))}});document.getElementById('check').onclick=checkSingle}
function pickSingle(el,idx){if(state.checked)return;state.selected=idx;document.querySelectorAll('.option').forEach(function(n){n.classList.remove('selected')});el.classList.add('selected');document.getElementById('check').disabled=false}
function checkSingle(){if(state.selected===null||state.checked)return;state.checked=true;var x=state.items[state.i];var answer=x.correct[0];var ok=state.selected===answer;if(ok)state.score++;document.querySelectorAll('.option').forEach(function(el){var i=Number(el.dataset.i);if(i===answer)el.classList.add('correct');else if(i===state.selected&&!ok)el.classList.add('wrong');el.disabled=true});feedback(ok,x)}
function renderMulti(x){var opts=x.options.map(function(v,i){return {v:v,i:i}});opts=shuffle(opts);document.getElementById('quiz').innerHTML=header(x)+'<div class="small">اختر جميع الإجابات الصحيحة.</div><div class="q">'+x.question+'</div><div id="opts">'+opts.map(function(o){return '<button class="option" data-i="'+o.i+'">'+o.v+'</button>'}).join('')+'</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>';document.querySelectorAll('.option').forEach(function(el){el.onclick=function(){pickMulti(el,Number(el.dataset.i))}});document.getElementById('check').onclick=checkMulti}
function pickMulti(el,idx){if(state.checked)return;var k=state.selectedMany.indexOf(idx);if(k>=0){state.selectedMany.splice(k,1);el.classList.remove('selected')}else{state.selectedMany.push(idx);el.classList.add('selected')}document.getElementById('check').disabled=state.selectedMany.length===0}
function sameSet(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>=0})}
function checkMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;var x=state.items[state.i];var ok=sameSet(state.selectedMany,x.correct);if(ok)state.score++;document.querySelectorAll('.option').forEach(function(el){var i=Number(el.dataset.i);if(x.correct.indexOf(i)>=0)el.classList.add('correct');else if(state.selectedMany.indexOf(i)>=0)el.classList.add('wrong');el.disabled=true});feedback(ok,x)}
function feedback(ok,x){var correct=x.correct.map(function(i){return x.options[i]});document.getElementById('fb').innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'✅ إِجَابَةٌ صَحِيحَةٌ':'❌ إِجَابَةٌ خَاطِئَةٌ')+'<div class="explain">'+(ok?'':('الإِجَابَةُ الصَّحِيحَةُ:<br>• '+correct.join('<br>• ')+'<br>'))+x.explanation+'</div></div><button id="next" class="btn secondary" style="margin-top:12px">السؤال التالي</button>';document.getElementById('next').onclick=next;document.getElementById('check').classList.add('hidden')}
function next(){state.i++;state.selected=null;state.selectedMany=[];state.checked=false;if(state.i>=state.items.length)return finish();render()}
function finish(){show('result');document.getElementById('result').innerHTML='<h2>النتيجة</h2><div class="score">'+state.score+' / '+state.items.length+'</div><button id="restartBtn" class="btn">أعد التدريب</button><button id="homeBtn" class="btn ghost" style="margin-top:10px">الرجوع إلى القائمة</button>';document.getElementById('restartBtn').onclick=restartCurrent;document.getElementById('homeBtn').onclick=function(){show('home')}}
function restartCurrent(){if(state.mode==='single')startSingle();else if(state.mode==='multiple')startMultiple();else startAll()}
document.getElementById('pageTitle').textContent='النصوص الأدبية – '+(isLesson?lessonNames[selectedCourse]:'مراجعة الدروس ١–٥');
document.getElementById('pageSubtitle').textContent=isLesson?'القواعد والمعاني والجوانب البلاغية':'٣٠ سؤالًا متنوعًا: ٦ أسئلة من كل درس، مع تجديد المزيج عند إعادة التدريب';
document.getElementById('questionCount').textContent=allQuestions.length;</script></body></html>
