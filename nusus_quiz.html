<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>النصوص الأدبية – مراجعة الدروس</title><style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#1f2a24;--muted:#6f7a73;--accent:#2f6b4f;--accent2:#e6efe9;--good:#1f7a4d;--bad:#a33a3a;--line:#dfe6e1}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#234c39,#3c7659);color:#fff;padding:24px 20px;border-radius:24px;box-shadow:0 10px 30px rgba(31,42,36,.12)}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.9}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(31,42,36,.06)}.menu{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%}.btn.secondary{background:var(--accent2);color:var(--accent)}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn:disabled{opacity:.5}.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);padding:14px;border-radius:14px;margin:10px 0;font-size:17px;cursor:pointer;line-height:1.8}.option.selected{border-color:var(--accent);background:#f0f6f2}.option.correct{border-color:var(--good);background:#eef8f2}.option.wrong{border-color:var(--bad);background:#fff0f0}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:14px;color:var(--muted)}.progress{height:9px;background:#e8ece9;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}.q{font-size:22px;font-weight:800;margin:6px 0 12px;line-height:1.9}.feedback{padding:13px 14px;border-radius:14px;margin-top:14px;font-weight:700}.feedback.good{background:#eef8f2;color:var(--good)}.feedback.bad{background:#fff0f0;color:var(--bad)}.explain{font-weight:500;color:var(--ink);margin-top:6px}.hidden{display:none!important}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}.score{font-size:42px;font-weight:900;color:var(--accent);text-align:center;margin:18px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.navline{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.navlink{color:var(--accent);text-decoration:none;font-weight:800;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f6f8f6;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}@media(max-width:600px){.hero h1{font-size:24px}.q{font-size:20px}.stats{grid-template-columns:1fr}}

.passage{margin:15px 0;padding:14px 16px;background:var(--accent2);border-inline-start:4px solid var(--accent);border-radius:12px;color:var(--ink);font-size:1.12rem;line-height:1.95}
.passage div{white-space:pre-line}.passage summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:1rem}
.option{text-align:right;width:100%;font-family:inherit;color:var(--ink)}
.option.correct{border-color:var(--good);background:#e6f5ed}.option.wrong{border-color:var(--bad);background:#fceceb}
.q{margin:14px 0;font-weight:700}.navline{margin-bottom:14px}
</style></head><body>
<div class="wrap">
<nav class="navline"><a class="navlink" href="index.html#nusus">النُّصُوصُ الْأَدَبِيَّةُ</a><a class="navlink" href="index.html">الرَّئِيسِيَّةُ</a></nav>
<section class="hero"><h1 id="title"></h1><p id="subtitle"></p></section>
<section id="home" class="card"><p>اِقْرَأِ الْمَقْطَعَ، ثُمَّ اخْتَرْ إِجَابَةً وَاحِدَةً. تَظْهَرُ لَكَ الْإِجَابَةُ وَالتَّوْضِيحُ بَعْدَ التَّصْحِيحِ.</p><button class="btn" id="start">اِبْدَأِ التَّدْرِيبَ</button></section>
<section id="quiz" class="card hidden" aria-label="السؤال"></section>
<section id="result" class="card hidden" aria-label="النتيجة"></section>
</div>
<script src="nusus-exam-data.js"></script>
<script>
const $ = id => document.getElementById(id);
const labels = ['أ','ب','ج','د'];
const countFormat = new Intl.NumberFormat('ar');
const n = number => countFormat.format(number);
const sections = examRaw.trim().split(/^@/m).filter(Boolean).map(block => {
  const [header, ...body] = block.trim().split('\n');
  const passage = body.filter(line=>!line.includes('|')).join('\n').replaceAll(' ** ', '    —    ');
  const lines = body.filter(line=>line.includes('|'));
  const [course, source] = header.split('|');
  return {course, source, passage, items: lines.map(line => {
    const [question, answer, a, b, c, explanation] = line.split('|');
    return {question, answer, options:[answer,a,b,c], explanation};
  })};
});
const shortlist = ["مَاذَا تُفِيدُ «مِنْ» فِي «وَمَا يَخْفَى عَلَى اللَّهِ مِنْ شَيْءٍ»؟", "مَا جَزَاءُ مَنْ يُنْفِقُونَ فِي سَبِيلِ اللَّهِ وَلَا يُتْبِعُونَ صَدَقَتَهُمْ مَنًّا وَلَا أَذًى؟", "مَا الْجَانِبُ الْبَلَاغِيُّ عِنْدَ إِطْلَاقِ «الْحَيِّ» عَلَى الْمُؤْمِنِ وَ«الْمَيِّتِ» عَلَى الْكَافِرِ؟", "عَمَّ تُكَنِّي «رَطْبَةٍ» فِي «كَبِدٍ رَطْبَةٍ»؟", "مَا نَوْعُ «مَا» فِي «مَا أَنَا بِآكِلٍ»؟", "مَا نَوْعُ الِاسْتِفْهَامِ فِي «أَتَشْفَعُ فِي حَدٍّ مِنْ حُدُودِ اللَّهِ»؟", "مَا الْأُسْلُوبُ فِي «لَا ظِلَّ إِلَّا ظِلُّهُ»؟", "مَا نَوْعُ التَّشْبِيهِ فِي «الصِّدْقُ أَمَانَةٌ»؟", "مَا الْبَلَاغَةُ فِي «بِالْأَمْسِ كَانُوا مُلُوكًا ... وَالْيَوْمَ هُمْ ... عُبْدَانُ»؟", "أَيُّ مَثَلٍ يَدْعُو إِلَى الِاسْتِعَانَةِ بِصَاحِبِ الْخِبْرَةِ؟"];
const escapeHtml = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function shuffle(values) {
  const copy = values.slice();
  for (let i=copy.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
function choose() {
  const all = sections.flatMap(s=>s.items.map(q=>({...q, source:s.source, passage:s.passage})));
  return shortlist.map(question=>all.find(q=>q.question===question));
}
let queue = [], index = 0, score = 0, selected = null, checked = false;
function show(panel) {
  for (const id of ['home','quiz','result']) $(id).classList.toggle('hidden',id!==panel);
}
function start() {
  queue=choose(); index=0; score=0; show('quiz'); render();
}
function render() {
  selected=null; checked=false;
  const q=queue[index], opts=shuffle(q.options);
  $('quiz').innerHTML = '<div class="toprow"><span class="pill">اخْتِيَارٌ وَاحِدٌ</span><span class="small">'+n(index+1)+' / '+n(queue.length)+'</span></div>'
    + '<div class="progress"><div class="bar" style="width:'+100*index/queue.length+'%"></div></div>'
    + '<details class="passage" open><summary>'+escapeHtml(q.source)+'</summary><div>'+escapeHtml(q.passage)+'</div></details>'
    + '<div class="q">'+escapeHtml(q.question)+'</div>'
    + '<div id="opts">'+opts.map((opt,i)=>'<button type="button" class="option" aria-pressed="false"><b>'+labels[i]+'.</b> '+escapeHtml(opt)+'</button>').join('')+'</div>'
    + '<div id="fb" aria-live="polite"></div><div class="actions"><button class="btn" id="check" disabled>تَحَقَّقْ</button> <button class="btn hidden" id="next">التَّالِي</button></div>';
  const buttons=[...$('opts').querySelectorAll('button')];
  buttons.forEach((button,i)=>button.onclick=()=>{
    if(checked)return;
    selected=i;
    buttons.forEach((node,j)=>{node.classList.toggle('selected',i===j);node.setAttribute('aria-pressed',String(i===j));});
    $('check').disabled=false;
  });
  $('check').onclick=()=>{
    if(checked||selected===null)return;
    checked=true;
    const ok=opts[selected]===q.answer;
    if(ok)score++;
    buttons.forEach((button,i)=>{
      button.classList.remove('selected');
      button.disabled=true;
      if(opts[i]===q.answer)button.classList.add('correct');
      else if(i===selected)button.classList.add('wrong');
    });
    $('fb').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'إِجَابَةٌ صَحِيحَةٌ':'إِجَابَةٌ خَاطِئَةٌ')+'</strong><div>الْإِجَابَةُ: '+escapeHtml(q.answer)+'</div><div>'+escapeHtml(q.explanation)+'</div></div>';
    $('check').classList.add('hidden');
    $('next').classList.remove('hidden');
    $('next').textContent=index+1===queue.length?'النَّتِيجَةُ':'التَّالِي';
  };
  $('next').onclick=()=>{ if(!checked)return; if(++index<queue.length){render(); window.scrollTo(0,0);}else finish(); };
}
function finish() {
  show('result');
  $('result').innerHTML='<h2>النَّتِيجَةُ</h2><div class="score">'+n(score)+' / '+n(queue.length)+'</div><button class="btn" id="restart">أَعِدِ التَّدْرِيبَ</button>';
  $('restart').onclick=start;
  window.scrollTo(0,0);
}
$('title').textContent='أَهَمُّ أَسْئِلَةِ النُّصُوصِ الْأَدَبِيَّةِ';
$('subtitle').textContent='١٠ أَسْئِلَةٍ مُخْتَارَةٍ مِنَ الدُّرُوسِ ٢–١٣';
$('start').onclick=start;
</script></body></html>
