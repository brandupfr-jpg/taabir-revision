<style>

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#234c39,#3c7659);color:#fff;padding:24px 20px;border-radius:24px;box-shadow:0 10px 30px rgba(31,42,36,.12)}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;opacity:.92}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(31,42,36,.06)}
.menu{display:grid;gap:12px}.btn{border:0;border-radius:16px;padding:15px 16px;font-size:17px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;width:100%;text-decoration:none;display:block;text-align:center}.btn.secondary{background:var(--accent2);color:var(--accent)}.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.option{display:block;width:100%;text-align:right;background:#fff;border:2px solid var(--line);padding:14px;border-radius:14px;margin:10px 0;font-size:17px;cursor:pointer}.option.selected{border-color:var(--accent);background:#f0f6f2}.option.correct{border-color:var(--good);background:#eef8f2}.option.wrong{border-color:var(--bad);background:#fff0f0}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:14px;color:var(--muted)}.progress{height:9px;background:#e8ece9;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:var(--accent);width:0}
.q{font-size:22px;font-weight:800;margin:6px 0 12px}.feedback{padding:13px 14px;border-radius:14px;margin-top:14px;font-weight:700}.feedback.good{background:#eef8f2;color:var(--good)}.feedback.bad{background:#fff0f0;color:var(--bad)}.explain{font-weight:500;color:var(--ink);margin-top:6px}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;direction:rtl;resize:vertical}.model{background:#f2f6f3;border-right:4px solid var(--accent);padding:14px;border-radius:12px;margin-top:12px}.hidden{display:none!important}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}.score{font-size:42px;font-weight:900;color:var(--accent);text-align:center;margin:18px 0}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
</style>

const multiQs=[

{q:"اختر الأفكار الموجودة في خطة موضوع القدس.",a:["موقع القدس وأهميتها","دخول المسلمين القدس في عهد عمر","حال القدس وأهلها في ظل الحكم الإسلامي","استيلاء اليهود على القدس وأسباب ذلك","حال القدس وأهلها في ظل الاحتلال اليهودي","استرداد المسلمين القدس مرة أخرى","أهداف اليهود بعد احتلالهم القدس مرة أخرى","الوسائل الكفيلة لاسترداد القدس"],o:["موقع القدس وأهميتها","دخول المسلمين القدس في عهد عمر","حال القدس وأهلها في ظل الحكم الإسلامي","استيلاء اليهود على القدس وأسباب ذلك","حال القدس وأهلها في ظل الاحتلال اليهودي","استرداد المسلمين القدس مرة أخرى","أهداف اليهود بعد احتلالهم القدس مرة أخرى","الوسائل الكفيلة لاسترداد القدس","تاريخ الأندلس","أحكام الزكاة"],ca:["مَوْقِعُ الْقُدْسِ وَأَهَمِّيَّتُهَا","دُخُولُ الْمُسْلِمِينَ الْقُدْسَ فِي عَهْدِ عُمَرَ","حَالُ الْقُدْسِ وَأَهْلِهَا فِي ظِلِّ الْحُكْمِ الْإِسْلَامِيِّ","اسْتِيلَاءُ الْيَهُودِ عَلَى الْقُدْسِ وَأَسْبَابُ ذٰلِكَ","حَالُ الْقُدْسِ وَأَهْلِهَا فِي ظِلِّ الِاحْتِلَالِ الْيَهُودِيِّ","اسْتِرْدَادُ الْمُسْلِمِينَ الْقُدْسَ مَرَّةً أُخْرَى","أَهْدَافُ الْيَهُودِ بَعْدَ احْتِلَالِهِمُ الْقُدْسَ مَرَّةً أُخْرَى","الْوَسَائِلُ الْكَفِيلَةُ لِاسْتِرْدَادِ الْقُدْسِ"],e:"هٰذِهِ هِيَ الْأَفْكَارُ الثَّمَانِيَةُ الَّتِي ذَكَرَهَا الْكِتَابُ."},
{q:"اختر ما يرتبط بالقدس في الدرس.",a:["المسجد الأقصى","الإسراء والمعراج","وثيقة الأمان"],o:["المسجد الأقصى","الإسراء والمعراج","وثيقة الأمان","المسجد الحرام داخل القدس","غزوة أحد"],ca:["الْمَسْجِدُ الْأَقْصَى","الْإِسْرَاءُ وَالْمِعْرَاجُ","وَثِيقَةُ الْأَمَانِ"],e:"هٰذِهِ مَعَانٍ وَأَحْدَاثٌ ذَكَرَتْهَا تَمْرِيناتُ الدَّرْسِ."},

const written=[
{q:"أين تقع القدس؟ وما أهميتها للمسلمين؟",a:"تَقَعُ الْقُدْسُ فِي فِلَسْطِين، وَفِيهَا الْمَسْجِدُ الْأَقْصَى، وَهِيَ مِنَ الْمُدُنِ الْمُهِمَّةِ لِلْمُسْلِمِينَ."},
{q:"اذكر المساجد الثلاثة التي لا تشد الرحال إلا إليها.",a:"الْمَسْجِدُ الْحَرَامُ، وَالْمَسْجِدُ النَّبَوِيُّ، وَالْمَسْجِدُ الْأَقْصَى."},
{q:"تحدث عن دخول المسلمين القدس في عهد عمر بن الخطاب رضي الله عنه.",a:"فَتَحَ الْمُسْلِمُونَ الْقُدْسَ فِي خِلَافَةِ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ، وَجَاءَ إِلَيْهَا وَتَسَلَّمَهَا بِنَفْسِهِ، وَكَتَبَ لِأَهْلِهَا وَثِيقَةَ الْأَمَانِ."},
{q:"كيف كان حال أهل القدس في ظل الحكم الإسلامي؟",a:"نَعِمَ أَهْلُ الْقُدْسِ بِالِاسْتِقْرَارِ وَالْعَدْلِ فِي ظِلِّ الْإِسْلَامِ."},
{q:"اكتب ثلاث جمل عن الصليبيين والقدس.",a:"اسْتَوْلَى الصَّلِيبِيُّونَ عَلَى الْقُدْسِ فِي غَفْلَةٍ مِنَ الْمُسْلِمِينَ. وَقَتَلُوا مِنْ أَهْلِهَا. ثُمَّ اسْتَرَدَّ الْمُسْلِمُونَ الْقُدْسَ عَلَى يَدِ صَلَاحِ الدِّينِ."},
{q:"اكتب ثلاث جمل عن اليهود والقدس كما في الدرس.",a:"اسْتَوْلَى الْيَهُودُ عَلَى الْقُدْسِ فِي الْعَصْرِ الْحَاضِرِ. وَيَعْمَلُونَ عَلَى تَهْوِيدِهَا. وَيَسْعَوْنَ إِلَى طَمْسِ مَعَالِمِهَا الْإِسْلَامِيَّةِ."},
{q:"اكتب ثلاث جمل عن الإسراء والمعراج.",a:"أُسْرِيَ بِالنَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِلَى الْمَسْجِدِ الْأَقْصَى. ثُمَّ عُرِجَ بِهِ مِنْهُ. وَهٰذَا يَدُلُّ عَلَى مَكَانَةِ الْمَسْجِدِ الْأَقْصَى."},
{q:"اذكر أهداف اليهود بعد احتلال القدس كما يفهم من التمرين.",a:"مِنْ أَهْدَافِهِمْ تَهْوِيدُ الْقُدْسِ وَطَمْسُ مَعَالِمِهَا الْإِسْلَامِيَّةِ."},
{q:"اذكر الأفكار الثماني التي يعينك بها الكتاب على كتابة موضوع القدس.",a:"١- مَوْقِعُ الْقُدْسِ وَأَهَمِّيَّتُهَا. ٢- دُخُولُ الْمُسْلِمِينَ الْقُدْسَ فِي عَهْدِ عُمَرَ. ٣- حَالُ الْقُدْسِ وَأَهْلِهَا فِي ظِلِّ الْحُكْمِ الْإِسْلَامِيِّ. ٤- اسْتِيلَاءُ الْيَهُودِ عَلَى الْقُدْسِ وَأَسْبَابُ ذٰلِكَ. ٥- حَالُ الْقُدْسِ وَأَهْلِهَا فِي ظِلِّ الِاحْتِلَالِ الْيَهُودِيِّ. ٦- اسْتِرْدَادُ الْمُسْلِمِينَ الْقُدْسَ مَرَّةً أُخْرَى. ٧- أَهْدَافُ الْيَهُودِ بَعْدَ الِاحْتِلَالِ. ٨- الْوَسَائِلُ الْكَفِيلَةُ لِاسْتِرْدَادِ الْقُدْسِ."},
{q:"اكتب موضوعا قصيرا عن القدس وواجب المسلمين نحوها.",a:"الْقُدْسُ مَدِينَةٌ مُهِمَّةٌ فِي فِلَسْطِين، وَفِيهَا الْمَسْجِدُ الْأَقْصَى. فَتَحَهَا الْمُسْلِمُونَ فِي عَهْدِ عُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ، وَنَعِمَ أَهْلُهَا بِالْعَدْلِ وَالِاسْتِقْرَارِ. ثُمَّ تَعَرَّضَتْ لِلِاحْتِلَالِ، وَيَعْمَلُ الْيَهُودُ عَلَى تَهْوِيدِهَا وَطَمْسِ مَعَالِمِهَا الْإِسْلَامِيَّةِ. وَيَجِبُ عَلَى الْمُسْلِمِينَ أَنْ يَهْتَمُّوا بِالْقُدْسِ وَيَعْمَلُوا عَلَى اسْتِرْدَادِهَا."}
];

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let state={mode:"",items:[],i:0,score:0,selected:null,selectedMany:[],checked:false,mastered:0,needs:0};
function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function header(title,total){const p=Math.round((state.i/total)*100);return `<div class="toprow"><span class="pill">${title}</span><span class="small">${state.i+1} / ${total}</span></div><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}

function startMCQ(){state={mode:"mcq",items:shuffle(mcqs),i:0,score:0,selected:null,checked:false};show("quiz");renderMCQ()}
function renderMCQ(){const x=state.items[state.i],opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختيار من متعدد",state.items.length)+`<div class="q">${x.q}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${o}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pick(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMCQ}
function pick(el,val){if(state.checked)return;state.selected=val;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("check").disabled=false}
function checkMCQ(){if(!state.selected||state.checked)return;state.checked=true;const x=state.items[state.i],ok=state.selected===x.a;if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(v===x.a)el.classList.add("correct");else if(v===state.selected&&!ok)el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ إِجَابَةٌ صَحِيحَةٌ":"❌ إِجَابَةٌ خَاطِئَةٌ"}<div class="explain">${ok?"":("الإِجَابَةُ الصَّحِيحَةُ: "+x.ca+"<br>")}${x.e}</div></div><button id="next" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("next").onclick=nextMCQ;document.getElementById("check").classList.add("hidden")}
function nextMCQ(){state.i++;state.selected=null;state.checked=false;if(state.i>=state.items.length)return finishMCQ();renderMCQ()}
function finishMCQ(){show("result");document.getElementById("result").innerHTML=`<h2>النتيجة</h2><div class="score">${state.score} / ${state.items.length}</div><button class="btn" onclick="startMCQ()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}

function startMulti(){state={mode:"multi",items:shuffle(multiQs),i:0,score:0,selectedMany:[],checked:false};show("quiz");renderMulti()}
function renderMulti(){const x=state.items[state.i],opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختر جميع الإجابات الصحيحة",state.items.length)+`<div class="small">قد تكون هناك إجابتان صحيحتان أو أكثر.</div><div class="q">${x.q}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${o}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMany(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMulti}
function pickMany(el,val){if(state.checked)return;const i=state.selectedMany.indexOf(val);if(i>=0){state.selectedMany.splice(i,1);el.classList.remove("selected")}else{state.selectedMany.push(val);el.classList.add("selected")}document.getElementById("check").disabled=state.selectedMany.length===0}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function checkMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;const x=state.items[state.i],ok=sameSet(state.selectedMany,x.a);if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(x.a.includes(v))el.classList.add("correct");else if(state.selectedMany.includes(v))el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ جَمِيعُ اخْتِيَارَاتِكَ صَحِيحَةٌ":"❌ لَمْ تَخْتَرْ جَمِيعَ الإِجَابَاتِ الصَّحِيحَةَ"}<div class="explain">${ok?"":("الإِجَابَاتُ الصَّحِيحَةُ:<br>• "+x.ca.join("<br>• ")+"<br>")}${x.e}</div></div><button id="nextMulti" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextMulti").onclick=nextMulti;document.getElementById("check").classList.add("hidden")}
function nextMulti(){state.i++;state.selectedMany=[];state.checked=false;if(state.i>=state.items.length)return finishMulti();renderMulti()}
function finishMulti(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة الاختيار بإجابات متعددة</h2><div class="score">${state.score} / ${state.items.length}</div><button class="btn" onclick="startMulti()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}

function startWritten(){state={mode:"written",items:shuffle(written),i:0,mastered:0,needs:0};show("quiz");renderWritten()}
function renderWritten(){const x=state.items[state.i];document.getElementById("quiz").innerHTML=header("إجابة كتابية",state.items.length)+`<div class="q">${x.q}</div><textarea id="ans" placeholder="اكتب إجابتك هنا أولا..."></textarea><button id="reveal" class="btn" style="margin-top:12px">أظهر الإجابة النموذجية</button><div id="model"></div>`;document.getElementById("reveal").onclick=revealWritten}
function revealWritten(){const txt=document.getElementById("ans").value.trim();if(!txt){alert("اكتب إجابتك أولا.");return}const x=state.items[state.i];document.getElementById("model").innerHTML=`<div class="model"><b>الإِجَابَةُ النَّمُوذَجِيَّةُ:</b><br>${x.a}</div><div class="menu" style="margin-top:12px"><button id="good" class="btn">أجبت جيدا</button><button id="review" class="btn secondary">أحتاج إلى مراجعة</button></div>`;document.getElementById("good").onclick=()=>gradeWritten(true);document.getElementById("review").onclick=()=>gradeWritten(false)}
function gradeWritten(ok){ok?state.mastered++:state.needs++;state.i++;if(state.i>=state.items.length)return finishWritten();renderWritten()}
function finishWritten(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة التدريب الكتابي</h2><div class="score">${state.mastered} / ${state.items.length}</div><p style="text-align:center">أجبت جيدا عن <b>${state.mastered}</b>، وتحتاج إلى مراجعة <b>${state.needs}</b>.</p><button class="btn" onclick="startWritten()">أعد التدريب</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}

function startMock(){const qs=shuffle(mcqs).slice(0,6).map(x=>({t:"m",...x}));const ms=shuffle(multiQs).slice(0,4).map(x=>({t:"x",...x}));const ws=shuffle(written).slice(0,10).map(x=>({t:"w",...x}));state={mode:"mock",items:[...shuffle([...qs,...ms]),...ws],i:0,score:0,selected:null,selectedMany:[],checked:false,mastered:0,needs:0};show("quiz");renderMock()}
function renderMock(){if(state.i>=state.items.length)return finishMock();const x=state.items[state.i];if(x.t==="m"){const opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">اختيار من متعدد</div><div class="q">${x.q}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${o}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابة</button><div id="fb"></div>`;document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMock(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMockMCQ}else if(x.t==="x"){const opts=shuffle(x.o);document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">اختر جميع الإجابات الصحيحة</div><div class="q">${x.q}</div><div id="opts">${opts.map(o=>`<button class="option" data-v="${encodeURIComponent(o)}">${o}</button>`).join("")}</div><button id="check" class="btn" disabled>تحقق من الإجابات</button><div id="fb"></div>`;state.selectedMany=[];document.querySelectorAll(".option").forEach(el=>el.onclick=()=>pickMockMany(el,decodeURIComponent(el.dataset.v)));document.getElementById("check").onclick=checkMockMulti}else{document.getElementById("quiz").innerHTML=header("اختبار تجريبي",state.items.length)+`<div class="small">إجابة كتابية</div><div class="q">${x.q}</div><textarea id="ans" placeholder="اكتب إجابتك هنا..."></textarea><button id="revealM" class="btn" style="margin-top:12px">أظهر الإجابة النموذجية</button><div id="model"></div>`;document.getElementById("revealM").onclick=revealMockWritten}}
function pickMock(el,val){if(state.checked)return;state.selected=val;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("check").disabled=false}
function checkMockMCQ(){if(!state.selected||state.checked)return;state.checked=true;const x=state.items[state.i],ok=state.selected===x.a;if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(v===x.a)el.classList.add("correct");else if(v===state.selected&&!ok)el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ إِجَابَةٌ صَحِيحَةٌ":"❌ إِجَابَةٌ خَاطِئَةٌ"}<div class="explain">${ok?"":("الإِجَابَةُ الصَّحِيحَةُ: "+x.ca+"<br>")}${x.e}</div></div><button id="nextM" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextM").onclick=nextMock;document.getElementById("check").classList.add("hidden")}
function pickMockMany(el,val){if(state.checked)return;const i=state.selectedMany.indexOf(val);if(i>=0){state.selectedMany.splice(i,1);el.classList.remove("selected")}else{state.selectedMany.push(val);el.classList.add("selected")}document.getElementById("check").disabled=state.selectedMany.length===0}
function checkMockMulti(){if(!state.selectedMany.length||state.checked)return;state.checked=true;const x=state.items[state.i],ok=sameSet(state.selectedMany,x.a);if(ok)state.score++;document.querySelectorAll(".option").forEach(el=>{const v=decodeURIComponent(el.dataset.v);if(x.a.includes(v))el.classList.add("correct");else if(state.selectedMany.includes(v))el.classList.add("wrong");el.disabled=true});document.getElementById("fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"✅ جَمِيعُ اخْتِيَارَاتِكَ صَحِيحَةٌ":"❌ لَمْ تَخْتَرْ جَمِيعَ الإِجَابَاتِ الصَّحِيحَةَ"}<div class="explain">${ok?"":("الإِجَابَاتُ الصَّحِيحَةُ:<br>• "+x.ca.join("<br>• ")+"<br>")}${x.e}</div></div><button id="nextM" class="btn secondary" style="margin-top:12px">السؤال التالي</button>`;document.getElementById("nextM").onclick=nextMock;document.getElementById("check").classList.add("hidden")}
function revealMockWritten(){const txt=document.getElementById("ans").value.trim();if(!txt){alert("اكتب إجابتك أولا.");return}const x=state.items[state.i];document.getElementById("model").innerHTML=`<div class="model"><b>الإِجَابَةُ النَّمُوذَجِيَّةُ:</b><br>${x.a}</div><div class="menu" style="margin-top:12px"><button id="goodM" class="btn">أجبت جيدا</button><button id="reviewM" class="btn secondary">أحتاج إلى مراجعة</button></div>`;document.getElementById("goodM").onclick=()=>gradeMockWritten(true);document.getElementById("reviewM").onclick=()=>gradeMockWritten(false)}
function gradeMockWritten(ok){ok?state.mastered++:state.needs++;nextMock()}
function nextMock(){state.i++;state.selected=null;state.selectedMany=[];state.checked=false;renderMock()}
function finishMock(){show("result");document.getElementById("result").innerHTML=`<h2>نتيجة الاختبار التجريبي</h2><p style="text-align:center"><b>أسئلة الاختيار:</b></p><div class="score">${state.score} / 10</div><p style="text-align:center"><b>الإجابات الكتابية التي أجبت عنها جيدا:</b> ${state.mastered} / 10</p><button class="btn" onclick="startMock()">أعد الاختبار</button><button class="btn ghost" style="margin-top:10px" onclick="show('home')">الرجوع إلى القائمة</button>`}
</script>
</body>
</html>
