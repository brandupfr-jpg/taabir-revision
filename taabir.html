<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التعبير — مراجعة الكتاب كاملا</title><style>
:root{--bg:#f6f4ee;--ink:#1e2923;--green:#2f6b4f;--line:#dfe6e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.8}main{max-width:850px;margin:auto;padding:18px 14px 50px}header{padding:24px;background:var(--green);color:white;border-radius:22px;margin:12px 0 20px}h1{font-size:27px;margin:0}h2{font-size:23px}p{margin:8px 0}a{color:var(--green)}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:13px;padding:13px 17px;background:white;color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid #dfad37;outline-offset:3px}.primary{background:var(--green);color:white}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lesson{text-align:right}.lesson b,.lesson span{display:block}.lesson span,.muted{font-size:14px;color:#637269}.actions{display:flex;gap:10px;flex-wrap:wrap}.options{display:grid;gap:11px}.option{text-align:right;font-size:19px;line-height:1.8}.option:disabled{cursor:default;opacity:1}.correct{background:#e4f3e7;border:2px solid #31713f}.wrong{background:#fde9e7;border:2px solid #ac3830}.feedback{padding:16px;border-radius:12px;background:#eef3ef;margin:15px 0}progress{width:100%;accent-color:var(--green)}[hidden]{display:none!important}.review{border-bottom:1px solid var(--line);padding:14px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:17px}h1{font-size:24px}}
</style></head><body><main><a href="index.html#taabir">← الرجوع إلى دروس التعبير</a><header><h1>التعبير — مراجعة الكتاب كاملا</h1><p>١٠ دروس · ١٠ أسئلة لكل درس · ١٠٠ سؤال</p></header><section id="home"><div class="card"><h2>ابدأ المراجعة</h2><p>أسئلة أساسية من موضوعات الكتاب وتمريناته. اختر إجابة واحدة، ثم اقرأ التصحيح.</p><div class="actions"><button class="primary" id="all">مراجعة شاملة — ١٠٠ سؤال</button><button id="resume" hidden>متابعة المراجعة السابقة</button></div><p class="muted">الدرس العاشر: تطبيقات على كتابة قصة هادفة؛ فالكتاب يطلب كتابة قصة ولا يقدم أسئلة مفصلة.</p></div><div id="lessons" class="grid"></div></section><section id="quiz" class="card" hidden><div class="actions"><button id="back">قائمة الدروس</button><span id="count"></span></div><progress id="progress" value="0" max="100"></progress><p id="lesson" class="muted"></p><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback" role="status" hidden></div><button id="next" class="primary" hidden>السؤال التالي</button></section><section id="result" class="card" hidden></section></main><script src="taabir-data.js?v=20261117"></script><script src="taabir.js?v=20261117"></script></body></html>
